<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#020617">
<title>BOUNCY CHAT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* --- EXPRESSIVE DESIGN SYSTEM --- */
:root {
    --glass-bg: rgba(15, 23, 42, 0.6);
    --glass-border: rgba(255, 255, 255, 0.06);
    --primary: #6366f1;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --voice-glow: linear-gradient(90deg, #6366f1, #ec4899, #6366f1);
}

* { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
body {
    margin: 0; background: #020617; color: var(--text-main);
    font-family: 'Inter', sans-serif; height: 100dvh; overflow: hidden;
}

/* LIQUID CANVAS & PULSE OVERLAY */
#liquidCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: -2; pointer-events: none; }
#pulseOverlay {
    position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at center, rgba(99,102,241,0.2), transparent 70%);
    transition: opacity 0.3s ease;
}
#pulseOverlay.active { opacity: 1; animation: pulseFade 0.6s ease-out forwards; }
@keyframes pulseFade { 0% { transform: scale(0.95); opacity: 0.8; } 100% { transform: scale(1.1); opacity: 0; } }

/* LAYOUT */
.app-container { height: 100dvh; max-width: 1600px; margin: 0 auto; display: grid; grid-template-columns: 380px 1fr; position: relative; z-index: 1; }
.glass-panel { background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid var(--glass-border); }

/* SIDEBAR */
.sidebar { border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; background: rgba(2,6,23,0.5); }
.side-head { padding: 24px; display: flex; justify-content: space-between; align-items: center; }
.brand { font-family: 'Space Grotesk'; font-weight: 700; font-size: 26px; letter-spacing: -1px; }
.brand span { color: var(--primary); text-shadow: 0 0 25px rgba(99,102,241,0.6); }

.search-wrap { padding: 0 24px 20px; position: relative; }
.search-input { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); padding: 14px 14px 14px 45px; border-radius: 16px; color: white; font-size: 14px; }
.search-wrap::before { content:'🔍'; position:absolute; left:40px; top:14px; opacity:0.4; font-size:14px; }

.chat-list { flex:1; overflow-y:auto; padding: 10px; }
.chat-row { width:100%; display:flex; align-items:center; gap:16px; padding:16px; border-radius: 18px; margin-bottom: 8px; text-align:left; transition:0.3s; border: 1px solid transparent; }
.chat-row:hover { background: rgba(255,255,255,0.03); border-color: var(--glass-border); }
.chat-row.active { background: rgba(99,102,241,0.15); border-color: rgba(99,102,241,0.3); }

.avatar { width:52px; height:52px; border-radius:18px; background:linear-gradient(135deg,#334155,#1e293b); display:grid; place-items:center; font-weight:700; color:white; overflow:hidden; flex-shrink:0; border: 1px solid var(--glass-border); }
.avatar img { width:100%; height:100%; object-fit:cover; }
.chat-meta { flex:1; min-width:0; }
.chat-name { font-weight:600; font-size:15px; margin-bottom:6px; display:flex; justify-content:space-between; }
.chat-preview { color:var(--text-muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chat-time { font-size:11px; color:var(--text-muted); }

.side-footer { padding:20px; border-top:1px solid var(--glass-border); display:flex; align-items:center; gap:12px; background:rgba(0,0,0,0.2); }

/* CHAT AREA & WATERMARK */
.chat-area { display:flex; flex-direction:column; position:relative; overflow:hidden; }
.watermark-avatar {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 300px; height: 300px; border-radius: 50%; opacity: 0.03;
    filter: blur(40px); pointer-events: none; transition: opacity 0.5s ease;
    background-size: cover; background-position: center;
}
.empty-state { height:100%; display:grid; place-items:center; text-align:center; color:var(--text-muted); z-index: 2; }
.chat-header { padding:20px 30px; border-bottom:1px solid var(--glass-border); display:flex; align-items:center; gap:16px; background: rgba(2,6,23,0.7); backdrop-filter:blur(20px); z-index: 3; }
.header-info { flex:1; }
.header-name { font-weight:700; font-size:17px; font-family:'Space Grotesk'; }
.header-status { font-size:12px; color:var(--primary); margin-top:2px; }

.messages-container { flex:1; overflow-y:auto; padding:30px; display:flex; flex-direction:column; gap:16px; z-index: 2; }

/* EXPRESSIVE BUBBLES */
.bubble {
    max-width:70%; padding:14px 20px; border-radius:22px; line-height:1.5;
    position:relative; font-size:15px; word-wrap:break-word;
    animation: bubblePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    transition: font-weight 0.2s, opacity 0.2s;
}
@keyframes bubblePop { from { transform:scale(0.8) translateY(20px); opacity:0; } to { transform:scale(1) translateY(0); opacity:1; } }

.bubble.in { align-self:flex-start; background:rgba(30,41,59,0.8); border-bottom-left-radius:6px; border:1px solid var(--glass-border); color: #e2e8f0; }
.bubble.out { align-self:flex-end; background:linear-gradient(135deg,#6366f1,#8b5cf6); border-bottom-right-radius:6px; box-shadow:0 4px 20px rgba(99,102,241,0.3); color: white; }

/* EMOTIVE TYPOGRAPHY CLASSES (Applied via JS) */
.bubble.whisper { font-weight: 300; opacity: 0.8; font-size: 14px; }
.bubble.normal { font-weight: 400; }
.bubble.loud { font-weight: 600; letter-spacing: 0.2px; }
.bubble.shout { font-weight: 800; letter-spacing: 0.5px; font-size: 16px; }

.msg-time { display:block; font-size:10px; margin-top:8px; opacity:0.7; text-align:right; }

/* VOICE SCULPTURES */
.voice-sculpture {
    display: flex; align-items: center; gap: 10px; min-width: 180px;
}
.play-btn {
    width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.2);
    display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
}
.waveform {
    display: flex; align-items: center; gap: 3px; height: 24px; flex: 1;
}
.wave-bar {
    width: 3px; border-radius: 2px; background: currentColor; opacity: 0.6;
    animation: waveAnim 1.2s ease-in-out infinite alternate;
}
@keyframes waveAnim { 0% { transform: scaleY(0.3); } 100% { transform: scaleY(1); } }

/* COMPOSER */
.composer { padding:20px 30px; border-top:1px solid var(--glass-border); display:flex; gap:12px; align-items:center; background:rgba(2,6,23,0.7); backdrop-filter:blur(20px); z-index: 3; }
.msg-input { flex:1; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); border-radius:30px; padding:14px 24px; color:white; font-size:15px; }
.send-btn { width:50px; height:50px; border-radius:50%; background:var(--primary); color:white; display:grid; place-items:center; font-size:20px; box-shadow:0 4px 15px rgba(99,102,241,0.4); transition: transform 0.2s; }
.send-btn:active { transform: scale(0.9); }

/* AUTH & UTILS */
.auth-wrap { height:100dvh; display:grid; place-items:center; padding:20px; }
.auth-card { width:100%; max-width:400px; padding:40px; border-radius:28px; text-align:center; }
.field { width:100%; background:rgba(0,0,0,0.3); border:1px solid var(--glass-border); padding:16px; border-radius:16px; color:white; margin-bottom:15px; }
.primary-btn { width:100%; background:var(--primary); color:white; padding:16px; border-radius:16px; font-weight:600; margin-top:10px; box-shadow:0 4px 20px rgba(99,102,241,0.3); }
.hidden { display:none!important; }
button { cursor:pointer; border:0; background:none; color:inherit; font-family:inherit; }
.icon-btn { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; color:var(--text-muted); font-size:20px; }
.icon-btn:hover { background:rgba(255,255,255,0.05); color:white; }

@media(max-width:768px) {
    .app-container { grid-template-columns:1fr; }
    .chat-area { display:none; position:absolute; inset:0; z-index:10; background:#020617; }
    .app-container.chat-open .sidebar { display:none; }
    .app-container.chat-open .chat-area { display:flex; }
    .back-btn { display:block!important; margin-right:10px; }
    .back-btn { display:none; }
    .watermark-avatar { width: 200px; height: 200px; }
}
</style>
</head>
<body>

<!-- BACKGROUND ENGINES -->
<canvas id="liquidCanvas"></canvas>
<div id="pulseOverlay"></div>

<!-- AUTH VIEW -->
<div id="auth" class="auth-wrap">
    <div class="auth-card glass-panel">
        <div class="brand" style="justify-content:center; font-size:36px; margin-bottom:20px;">BOUNCY<span>.</span></div>
        <h1 style="font-family:'Space Grotesk'; margin:10px 0;">Welcome Back</h1>
        <p style="color:var(--text-muted); margin-bottom:30px;">Sign in to continue your conversations.</p>
        <form id="authForm">
            <input class="field" id="email" type="email" placeholder="Email Address" required>
            <input class="field" id="password" type="password" placeholder="Password" required>
            <button type="submit" class="primary-btn">Sign In</button>
        </form>
        <div style="margin-top:20px; font-size:14px; color:var(--text-muted);">
            New here? <button class="link" style="color:var(--primary); font-weight:600;" id="switchMode">Create Account</button>
        </div>
    </div>
</div>

<!-- MAIN APP -->
<div id="app" class="app-container hidden">
    <aside class="sidebar">
        <div class="side-head">
            <div class="brand">BOUNCY<span>.</span></div>
            <button class="icon-btn" id="newChatBtn">✎</button>
        </div>
        <div class="search-wrap"><input id="filterChats" class="search-input" placeholder="Search messages..."></div>
        <div id="chatList" class="chat-list"></div>
        <div class="side-footer">
            <div id="myAvatar" class="avatar" style="width:40px; height:40px; font-size:14px;"></div>
            <div style="flex:1; min-width:0;">
                <div id="myName" style="font-weight:600; font-size:14px;">User</div>
                <div id="myHandle" style="font-size:12px; color:var(--text-muted);">@handle</div>
            </div>
            <button class="icon-btn" id="signOut" style="color:#ef4444;">⇪</button>
        </div>
    </aside>

    <main class="chat-area">
        <!-- WATERMARK AVATAR -->
        <div id="watermark" class="watermark-avatar"></div>
        
        <div id="noChat" class="empty-state">
            <div>
                <div style="font-size:60px; margin-bottom:20px; opacity:0.2;">💬</div>
                <h2 style="font-family:'Space Grotesk'; margin-bottom:10px;">Select a conversation</h2>
                <p>Choose a friend or start a new chat.</p>
            </div>
        </div>
        
        <div id="chatPanel" class="hidden" style="display:flex; flex-direction:column; height:100%;">
            <header class="chat-header">
                <button class="icon-btn back-btn" id="backChats">←</button>
                <div id="peerAvatar" class="avatar" style="width:44px; height:44px;"></div>
                <div class="header-info">
                    <div id="peerName" class="header-name">User</div>
                    <div id="peerStatus" class="header-status">Online</div>
                </div>
            </header>
            <div id="messages" class="messages-container"></div>
            <form id="composer" class="composer">
                <input id="messageInput" class="msg-input" placeholder="Type a message..." autocomplete="off">
                <button type="submit" class="send-btn">➤</button>
            </form>
        </div>
    </main>
</div>

<script>
// --- LIQUID AURA ENGINE (KEPT FROM BEFORE) ---
const canvas = document.getElementById('liquidCanvas');
const ctx = canvas.getContext('2d');
let width, height, particles = [];
function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

class Particle {
    constructor() {
        this.x = Math.random() * width; this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.4; this.vy = (Math.random() - 0.5) * 0.4;
        this.radius = Math.random() * 250 + 150;
        const colors = ['rgba(99, 102, 241, 0.35)', 'rgba(139, 92, 246, 0.25)', 'rgba(59, 130, 246, 0.25)', 'rgba(236, 72, 153, 0.15)'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        if(this.x < -this.radius) this.x = width + this.radius;
        if(this.x > width + this.radius) this.x = -this.radius;
        if(this.y < -this.radius) this.y = height + this.radius;
        if(this.y > height + this.radius) this.y = -this.radius;
    }
    draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill(); }
}
for(let i=0; i<15; i++) particles.push(new Particle());
function animate() {
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = '#020617'; ctx.fillRect(0,0,width,height);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
}
animate();

// --- EXPRESSIVE TYPOGRAPHY ENGINE ---
function getEmotionClass(text) {
    if (!text) return 'normal';
    const t = text.trim();
    // Whisper: lowercase, ends with ..., very short
    if (t === t.toLowerCase() && (t.endsWith('...') || t.endsWith('…')) && t.length < 20) return 'whisper';
    // Shout: ALL CAPS, multiple ! or ?
    if (t === t.toUpperCase() && /[!?!]{2,}/.test(t)) return 'shout';
    // Loud: Mixed case but has ! or ?, or longer caps words
    if (/[A-Z]{3,}/.test(t) || /[!?]/.test(t)) return 'loud';
    return 'normal';
}

// --- VOICE SCULPTURE GENERATOR ---
function generateWaveformHTML(isMine) {
    const barCount = 20;
    let bars = '';
    for(let i=0; i<barCount; i++) {
        const h = Math.random() * 16 + 4; // Random height between 4px and 20px
        const delay = Math.random() * 1.2;
        bars += `<div class="wave-bar" style="height:${h}px; animation-delay:-${delay}s"></div>`;
    }
    const color = isMine ? 'white' : '#94a3b8';
    return `
    <div class="voice-sculpture" style="color:${color}">
        <div class="play-btn">▶</div>
        <div class="waveform">${bars}</div>
        <span style="font-size:11px; opacity:0.7; margin-left:5px;">0:14</span>
    </div>`;
}

// --- APP LOGIC ---
const SUPABASE_URL = 'https://lakupnehsetdazezlsrs.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_3ePLMRIKVNms7Qi461FQXw_x2TGc75s';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

let user=null, profile=null, activeConversation=null, conversations=[], activePeer=null;

function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#ef4444;color:white;padding:12px 24px;border-radius:30px;font-weight:600;z-index:999;';document.body.appendChild(t);setTimeout(()=>t.remove(),3000);}
function initials(n){return(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();}
function timeLabel(d){return new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function showAuth(){$('auth').classList.remove('hidden');$('app').classList.add('hidden');}
function showApp(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');}

$('authForm').onsubmit=async e=>{
    e.preventDefault();
    const email=$('email').value.trim(), password=$('password').value;
    try{
        const {data,error}=await sb.auth.signInWithPassword({email,password});
        if(error) throw error;
        await boot(data.user);
    }catch(err){toast(err.message)}
};

async function boot(u){
    user=u;
    const {data:p}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();
    profile=p;
    $('myName').textContent=profile?.display_name||'User';
    $('myHandle').textContent='@'+(profile?.username||'');
    $('myAvatar').innerHTML=profile?.avatar_url?`<img src="${esc(profile.avatar_url)}">`:initials(profile?.display_name);
    showApp();
    loadConversations();
}

async function loadConversations(){
    if(!user)return;
    const {data:members}=await sb.from('conversation_members').select('conversation_id').eq('user_id',user.id);
    if(!members||!members.length){renderConversations([]);return;}
    const ids=members.map(m=>m.conversation_id);
    const {data:convos}=await sb.from('conversations').select('*').in('id',ids).order('created_at',{ascending:false});
    const enriched=[];
    for(const c of(convos||[])){
        const {data:mems}=await sb.from('conversation_members').select('user_id').eq('conversation_id',c.id);
        const peerId=mems?.find(m=>m.user_id!==user.id)?.user_id;
        let peer=null;
        if(peerId){const {data:pd}=await sb.from('profiles').select('*').eq('id',peerId).single();peer=pd;}
        const {data:last}=await sb.from('messages').select('*').eq('conversation_id',c.id).order('created_at',{ascending:false}).limit(1);
        enriched.push({...c,peer,last:last?.[0]});
    }
    conversations=enriched;
    renderConversations(conversations);
}

function renderConversations(list){
    $('chatList').innerHTML=list.map(c=>{
        const name=c.peer?c.peer.display_name:(c.title||'Group');
        const sub=c.last?(c.last.sender_id===user.id?'You: ':'')+(c.last.body||'Voice message'):'Start chatting';
        const isActive=c.id===activeConversation?'active':'';
        const av=c.peer?.avatar_url?`<img src="${esc(c.peer.avatar_url)}">`:initials(name);
        return `<button class="chat-row ${isActive}" onclick="openConversation('${c.id}')"><div class="avatar">${av}</div><div class="chat-meta"><div class="chat-name"><span>${esc(name)}</span><span class="chat-time">${c.last?timeLabel(c.last.created_at):''}</span></div><div class="chat-preview">${esc(sub)}</div></div></button>`;
    }).join('');
}

async function openConversation(id){
    activeConversation=id;
    const convo=conversations.find(c=>c.id===id);
    activePeer=convo?.peer;
    
    $('noChat').classList.add('hidden');
    $('chatPanel').classList.remove('hidden');
    $('chatPanel').style.display='flex';
    
    const name=activePeer?activePeer.display_name:(convo?.title||'Unknown');
    $('peerName').textContent=name;
    $('peerStatus').textContent=activePeer?'@'+activePeer.username:'Group Chat';
    $('peerAvatar').innerHTML=activePeer?.avatar_url?`<img src="${esc(activePeer.avatar_url)}">`:initials(name);
    
    // Update Watermark
    const wm = $('watermark');
    if(activePeer?.avatar_url) {
        wm.style.backgroundImage = `url(${esc(activePeer.avatar_url)})`;
        wm.style.opacity = '0.04';
    } else {
        wm.style.backgroundImage = 'none';
        wm.style.opacity = '0';
    }
    
    $('app').classList.add('chat-open');
    loadMessages();
    subscribeMessages(id);
}

$('backChats').onclick=()=>$('app').classList.remove('chat-open');

async function loadMessages(){
    if(!activeConversation)return;
    const {data}=await sb.from('messages').select('*').eq('conversation_id',activeConversation).order('created_at',{ascending:true}).limit(100);
    renderMessages(data||[]);
}

function renderMessages(rows){
    const box=$('messages');
    box.innerHTML=rows.map(m=>{
        const mine=m.sender_id===user.id;
        const emotionClass = getEmotionClass(m.body);
        
        let content = '';
        if(m.message_type === 'voice') {
            content = generateWaveformHTML(mine);
        } else {
            content = esc(m.body||'');
        }
        
        return `<div class="bubble ${mine?'out':'in'} ${emotionClass}">${content}<span class="msg-time">${timeLabel(m.created_at)}</span></div>`;
    }).join('');
    box.scrollTop=box.scrollHeight;
}

function subscribeMessages(id){
    sb.channel('chat-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`conversation_id=eq.${id}`},()=>{loadMessages();loadConversations();}).subscribe();
}

$('composer').onsubmit=async e=>{
    e.preventDefault();
    const input=$('messageInput');
    const body=input.value.trim();
    if(!body||!activeConversation)return;
    input.value='';
    
    // Trigger Pulse Effect
    const overlay = $('pulseOverlay');
    overlay.classList.remove('active');
    void overlay.offsetWidth; // Trigger reflow
    overlay.classList.add('active');
    
    await sb.from('messages').insert({conversation_id:activeConversation,sender_id:user.id,body,message_type:'text'});
};

$('signOut').onclick=async()=>{await sb.auth.signOut();user=null;showAuth();};

(async()=>{const {data}=await sb.auth.getSession();if(data.session)await boot(data.session.user);else showAuth();})();
</script>
</body>
</html>
