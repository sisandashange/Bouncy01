<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial}
body{background:#17212b;color:#fff}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 0;background:#17212b;position:sticky;top:0}
.topbar .left{font-size:22px}
.tabs{display:flex;gap:36px;font-size:19px;font-weight:700;letter-spacing:.5px}
.tabs span{padding-bottom:12px;color:#8a9aa8;cursor:pointer}
.tabs span.on{color:#fff;border-bottom:3px solid #fff}
.search{font-size:22px}
.list{margin-top:4px}
.row{display:flex;gap:12px;padding:12px 14px;cursor:pointer;align-items:center}
.row:active{background:#2b5278}
.avatar{width:52px;height:52px;border-radius:50%;flex-shrink:0;object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.a1{background:#2AABEE}.a2{background:#ff8a3d}.a3{background:#e17076}.a4{background:#3d9a50}.a5{background:#7a5af8}.a6{background:#a13d9a}
.mid{flex:1;min-width:0;border-bottom:1px solid #232e3a;padding-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center}
.name{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name.green{color:#4CAF50}
.time{font-size:13px;color:#8a9aa8;white-space:nowrap;margin-left:8px}
.sub{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.last{font-size:15px;color:#8a9aa8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;padding:0 6px;margin-left:8px}
.badge.blue{background:#2AABEE;color:#fff}
.badge.grey{background:#6b7a88;color:#fff}
.check{color:#2AABEE}
.fab{position:fixed;right:18px;bottom:22px;width:58px;height:58px;border-radius:50%;background:#2AABEE;border:0;color:#fff;font-size:26px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
</style>
</head>
<body>

<div class="topbar">
  <div class="left">☰</div>
  <div class="tabs"><span class="on">CHATS</span><span>CALLS</span></div>
  <div class="search">🔍</div>
</div>

<div class="list" id="list"></div>
<button class="fab">✎</button>

<script>
let chats=[
 {name:"Jane",last:"Well I do help animals.",time:"15:34",unread:5,badge:"blue",img:"https://i.pravatar.cc/100?img=47"},
 {name:"Tyrion Lannister",last:"Sometimes possession is an...",time:"18:12",unread:0,initial:"TL",color:"a2"},
 {name:"Alena Shy",last:"😍 Sticker",time:"19:30",unread:0,check:true,img:"https://i.pravatar.cc/100?img=32"},
 {name:"Heisenberg",last:"You have my financial support if...",time:"18:32",unread:0,lock:true,img:"https://i.pravatar.cc/100?img=12"},
 {name:"Bender",last:"I looove new Pixels! If fact, they...",time:"16:30",unread:0,img:"https://i.pravatar.cc/100?img=13"},
 {name:"World News Today",last:"Telegram just updated their...",time:"15:12",unread:2,badge:"grey",muted:true,initial:"WNT",color:"a5"},
 {name:"EVE",last:"LaserBlastSafetyGuide.pdf",time:"12:54",unread:0,img:"https://i.pravatar.cc/100?img=44"},
 {name:"Nick",last:"We're gonna win this...",time:"12:22",unread:0,img:"https://i.pravatar.cc/100?img=59"},
];
document.getElementById('list').innerHTML=chats.map(c=>`
<div class="row">
  ${c.img?`<img class="avatar" src="${c.img}">`:`<div class="avatar ${c.color}">${c.initial}</div>`}
  <div class="mid">
    <div class="top"><span class="name ${c.lock?'green':''}">${c.lock?'🔒 ':''}${c.name} ${c.muted?'🔕':''}</span>
    <span class="time">${c.check?'<span class="check">✓✓</span> ':''}${c.time}</span></div>
    <div class="sub"><span class="last">${c.last}</span>${c.unread?`<span class="badge ${c.badge}">${c.unread}</span>`:''}</div>
  </div>
</div>`).join('');
</script>
</body>
</html>
