<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>REAL BRAND DESIGNER - STRICT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#111;color:#fff;overflow:hidden}
#header{height:55px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;background:#000;border-bottom:1px solid #333}
#header b{font-size:17px;letter-spacing:1px}
#header button{background:#fff;color:#000;border:0;padding:8px 14px;border-radius:20px;font-weight:900}
#stage{height:52vh;position:relative;background:#222;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage img{height:100%;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))}
#designLayer{position:absolute;top:50%;left:50%;transform:translate(-50%,-38%);text-align:center;pointer-events:none;max-width:55%}
#designLayer h2{font-size:34px;font-weight:900;letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.4);line-height:1}
#designLayer p{font-size:11px;letter-spacing:4px;margin-top:4px}
#designLayer img{width:90px;height:auto;filter:none}
#controls{height:calc(100vh - 55px - 52vh);overflow-y:auto;padding:12px;background:#111}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{background:#222;border:1px solid #333;padding:10px 14px;border-radius:14px;white-space:nowrap;font-weight:700;font-size:13px;color:#fff}
.chip.on{background:#FE2C55;border-color:#FE2C55}
.swatch{width:38px;height:38px;border-radius:50%;border:2px solid #fff;flex-shrink:0}
label{font-size:12px;opacity:.7;display:block;margin:10px 0 6px}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #333;background:#222;color:#fff;font-size:15px}
#downloadBtn{width:100%;padding:15px;border:0;border-radius:14px;background:#FE2C55;color:#fff;font-size:16px;font-weight:900;margin-top:12px}
#brandPreview{font-size:12px;opacity:.7;margin-top:8px;text-align:center}
</style>
</head>
<body>
<div id="header"><b>MY BRAND STUDIO 👕</b><button onclick="downloadDesign()">Download PNG ⬇️</button></div>

<div id="stage">
  <!-- REAL CLOTHES PHOTOS - not 3D boxes -->
  <img id="garmentImg" src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=800&q=80" crossorigin="anonymous">
  <div id="designLayer"><h2 id="brandText">STRICT</h2><p id="subText">PIETERMARITZBURG • 2026</p><img id="logoImg" style="display:none"></div>
</div>

<div id="controls">
<label>1. CHOOSE REAL GARMENT</label>
<div class="row">
<button class="chip on" onclick="setGarment('hoodie',this)">Oversized Hoodie</button>
<button class="chip" onclick="setGarment('tee',this)">T-Shirt</button>
<button class="chip" onclick="setGarment('cap',this)">Cap</button>
<button class="chip" onclick="setGarment('crew',this)">Sweater</button>
</div>

<label>2. YOUR BRAND NAME</label>
<input id="brandInput" value="STRICT" oninput="document.getElementById('brandText').textContent=this.value.toUpperCase()">
<input id="subInput" value="PIETERMARITZBURG • 2026" style="margin-top:8px" oninput="document.getElementById('subText').textContent=this.value.toUpperCase()">

<label>3. GARMENT COLOUR - real tint</label>
<div class="row">
<div class="swatch" style="background:#111" onclick="setColor('#111','#fff',this)"></div>
<div class="swatch" style="background:#fff" onclick="setColor('#f5f5f5','#111',this)"></div>
<div class="swatch" style="background:#c1121f" onclick="setColor('#c1121f','#fff',this)"></div>
<div class="swatch" style="background:#2563eb" onclick="setColor('#2563eb','#fff',this)"></div>
<div class="swatch" style="background:#2ecc71" onclick="setColor('#2ecc71','#fff',this)"></div>
<div class="swatch" style="background:#f1c40f" onclick="setColor('#f1c40f','#111',this)"></div>
<div class="swatch" style="background:#ff6b9d" onclick="setColor('#ff6b9d','#fff',this)"></div>
</div>

<label>4. TEXT STYLE</label>
<div class="row">
<button class="chip on" onclick="setFont('Arial Black',this)">BOLD</button>
<button class="chip" onclick="setFont('Georgia',this)">CLASSIC</button>
<button class="chip" onclick="setFont('Courier New',this)">STREET</button>
<button class="chip" onclick="setFont('Impact',this)">IMPACT</button>
</div>

<label>5. UPLOAD YOUR LOGO (your brand logo PNG)</label>
<input type="file" accept="image/*" onchange="loadLogo(event)">
<label>6. TEXT SIZE</label>
<input type="range" min="18" max="60" value="34" oninput="document.getElementById('brandText').style.fontSize=this.value+'px'">

<button id="downloadBtn" onclick="downloadDesign()">⬇️ DOWNLOAD DESIGN FOR FACTORY / PRINTFUL</button>
<p id="brandPreview">This downloads a real PNG you can send to a printer in PMB or upload to Printful / Yoco store.</p>
</div>

<script>
let garmentPhotos={
  hoodie:'https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=800&q=80',
  tee:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=800&q=80',
  cap:'https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=800&q=80',
  crew:'https://images.unsplash.com/photo-1576871337622-98d48d1cf531?w=800&q=80'
};
function setGarment(type,el){ document.querySelectorAll('.chip').forEach(c=>{ if(['Oversized','T-Shirt','Cap','Sweater'].some(t=>c.textContent.includes(t))) c.classList.remove('on') }); el.classList.add('on'); document.getElementById('garmentImg').src=garmentPhotos[type]; }
function setColor(bg,textColor,el){ document.getElementById('stage').style.background=bg; document.getElementById('brandText').style.color=textColor; document.getElementById('subText').style.color=textColor; }
function setFont(font,el){ document.querySelectorAll('.chip').forEach(c=>{ if(['BOLD','CLASSIC','STREET','IMPACT'].includes(c.textContent)) c.classList.remove('on') }); el.classList.add('on'); document.getElementById('brandText').style.fontFamily=font; }
function loadLogo(e){ let f=e.target.files[0]; if(!f) return; let url=URL.createObjectURL(f); let img=document.getElementById('logoImg'); img.src=url; img.style.display='block'; document.getElementById('brandText').style.display='none'; }
function downloadDesign(){
  // Export: draw garment + text to canvas for factory
  let garment=document.getElementById('garmentImg');
  let c=document.createElement('canvas'); c.width=800; c.height=1000; let ctx=c.getContext('2d');
  ctx.fillStyle='#222'; ctx.fillRect(0,0,800,1000);
  // Draw garment image centered
  try{ ctx.drawImage(garment,100,50,600,750); }catch(e){}
  ctx.fillStyle='#fff'; ctx.font='900 70px Arial'; ctx.textAlign='center';
  ctx.fillText(document.getElementById('brandText').textContent,400,550);
  ctx.font='20px Arial'; ctx.fillText(document.getElementById('subText').textContent,400,585);
  let a=document.createElement('a'); a.download=(document.getElementById('brandInput').value||'mybrand')+'-design.png'; a.href=c.toDataURL('image/png'); a.click();
  alert('✅ Design downloaded! Send this PNG to your printer / Printful / Yoco store.');
}
</script>
</body>
</html>
