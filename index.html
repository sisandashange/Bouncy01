<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D FASHION STUDIO & CREATOR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{overflow:hidden;background:#0d0d0d;color:#fff}
canvas{display:block;width:100vw;height:100vh}

/* UI Layout */
#header{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(18,18,18,0.85);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:20;border-bottom:1px solid rgba(255,255,255,0.1)}
#header h1{font-size:18px;font-weight:800;letter-spacing:1px;background:linear-gradient(45deg,#ff758c,#ff7eb3);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.action-btn{background:#fff;color:#000;border:0;padding:8px 16px;border-radius:20px;font-weight:700;font-size:13px;cursor:pointer}

/* Studio Toolbar */
#toolbar{position:fixed;bottom:0;left:0;right:0;height:160px;background:rgba(18,18,18,0.9);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,0.1);z-index:20;display:flex;flex-direction:column;padding:12px}
.tool-tabs{display:flex;gap:12px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px}
.tab-btn{background:rgba(255,255,255,0.08);border:0;color:#aaa;padding:6px 14px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer}
.tab-btn.active{background:#fff;color:#000}

.tool-panel{display:none;gap:10px;align-items:center;overflow-x:auto}
.tool-panel.active{display:flex}

/* Swatches & Controls */
.color-swatch{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);cursor:pointer;flex-shrink:0}
.color-swatch.selected{border-color:#fff;transform:scale(1.1)}
.asset-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:8px 14px;border-radius:12px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;cursor:pointer}
.asset-card.active{background:#ff758c;border-color:#ff758c}

/* Modal Overlay */
#modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
.modal-content{background:#18181b;width:100%;max-width:380px;border-radius:24px;padding:24px;border:1px solid rgba(255,255,255,0.1);display:flex;flex-direction:column;gap:16px}
.modal-content h2{font-size:20px;font-weight:700}
.modal-input{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);padding:12px;border-radius:12px;color:#fff;font-size:14px}
</style>
<!-- Three.js Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- Supabase Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="header">
  <h1>3D FASHION STUDIO</h1>
  <button class="action-btn" onclick="openPublishModal()">Publish 🚀</button>
</div>

<div id="toolbar">
  <div class="tool-tabs">
    <button class="tab-btn active" onclick="switchTab('garments', this)">Garments</button>
    <button class="tab-btn" onclick="switchTab('fabric', this)">Fabric & Color</button>
    <button class="tab-btn" onclick="switchTab('decals', this)">Logos & Decals</button>
  </div>

  <!-- Garments Panel -->
  <div id="panel-garments" class="tool-panel active">
    <div class="asset-card active" onclick="switchGarment('hoodie', this)">Oversized Hoodie</div>
    <div class="asset-card" onclick="switchGarment('tee', this)">Graphic T-Shirt</div>
    <div class="asset-card" onclick="switchGarment('puffer', this)">Puffer Jacket</div>
    <div class="asset-card" onclick="switchGarment('jeans', this)">Cargo Jeans</div>
  </div>

  <!-- Fabric & Color Panel -->
  <div id="panel-fabric" class="tool-panel">
    <div class="color-swatch selected" style="background:#1e1e24" onclick="setGarmentColor(0x1e1e24, this)"></div>
    <div class="color-swatch" style="background:#ff3366" onclick="setGarmentColor(0xff3366, this)"></div>
    <div class="color-swatch" style="background:#3366ff" onclick="setGarmentColor(0x3366ff, this)"></div>
    <div class="color-swatch" style="background:#2ecc71" onclick="setGarmentColor(0x2ecc71, this)"></div>
    <div class="color-swatch" style="background:#f1c40f" onclick="setGarmentColor(0xf1c40f, this)"></div>
    <div class="color-swatch" style="background:#f5f6fa" onclick="setGarmentColor(0xf5f6fa, this)"></div>
  </div>

  <!-- Decals Panel -->
  <div id="panel-decals" class="tool-panel">
    <div class="asset-card active" onclick="setLogo('STRICT')">STRICT™ Logo</div>
    <div class="asset-card" onclick="setLogo('STAR')">★ Star Emblem</div>
    <div class="asset-card" onclick="setLogo('TOKYO')">Tokyo 2026</div>
  </div>
</div>

<!-- Publish Modal -->
<div id="modal">
  <div class="modal-content">
    <h2>Publish to Community</h2>
    <input type="text" id="designName" class="modal-input" placeholder="Give your design a title...">
    <input type="text" id="designerName" class="modal-input" placeholder="Your Creator Handle...">
    <button class="action-btn" style="width:100%;padding:12px;background:linear-gradient(45deg,#ff758c,#ff7eb3);color:#fff" onclick="publishDesign()">Submit to Feed</button>
    <button class="tab-btn" style="width:100%;text-align:center" onclick="closePublishModal()">Cancel</button>
  </div>
</div>

<script>
// --- SUPABASE CONFIGURATION ---
// Replace with your Supabase free tier project URL and anon key
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
let supabaseClient = null;
try {
  if(SUPABASE_URL !== 'YOUR_SUPABASE_URL') {
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch(e) { console.log('Supabase offline mode'); }

// --- 3D SCENE SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121214);
scene.fog = new THREE.FogExp2(0x121214, 0.03);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.5, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(5, 10, 7);
dirLight.castShadow = true;
scene.add(dirLight);

const rimLight = new THREE.DirectionalLight(0xff758c, 0.8);
rimLight.position.set(-5, 5, -5);
scene.add(rimLight);

// --- PROCEDURAL GARMENT & MODEL BUILDER ---
let currentGarmentGroup = new THREE.Group();
scene.add(currentGarmentGroup);

const fabricMaterial = new THREE.MeshStandardMaterial({ color: 0x1e1e24, roughness: 0.8, metalness: 0.1 });
const skinMaterial = new THREE.MeshStandardMaterial({ color: 0xdcbadc, roughness: 0.5 });

function buildAvatarModel() {
  const avatarGroup = new THREE.Group();
  // Head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 32), skinMaterial);
  head.position.y = 1.7;
  avatarGroup.add(head);
  // Neck
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.2, 16), skinMaterial);
  neck.position.y = 1.45;
  avatarGroup.add(neck);
  return avatarGroup;
}

const baseAvatar = buildAvatarModel();
scene.add(baseAvatar);

function createHoodieMesh() {
  const group = new THREE.Group();
  // Torso / Body
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.45, 1.1, 32), fabricMaterial);
  body.position.y = 0.85;
  group.add(body);
  // Hood
  const hood = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16, 0, Math.PI * 2, 0, Math.PI * 0.6), fabricMaterial);
  hood.position.set(0, 1.4, -0.05);
  hood.rotation.x = 0.2;
  group.add(hood);
  // Sleeves
  const sleeveGeo = new THREE.CylinderGeometry(0.16, 0.13, 0.9, 16);
  const leftSleeve = new THREE.Mesh(sleeveGeo, fabricMaterial);
  leftSleeve.position.set(-0.55, 1.0, 0);
  leftSleeve.rotation.z = 0.5;
  group.add(leftSleeve);

  const rightSleeve = new THREE.Mesh(sleeveGeo, fabricMaterial);
  rightSleeve.position.set(0.55, 1.0, 0);
  rightSleeve.rotation.z = -0.5;
  group.add(rightSleeve);

  return group;
}

function createTeeMesh() {
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.46, 0.85, 32), fabricMaterial);
  body.position.y = 0.95;
  group.add(body);
  return group;
}

function createPufferMesh() {
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.56, 0.52, 1.15, 32), fabricMaterial);
  body.position.y = 0.85;
  group.add(body);
  return group;
}

function createJeansMesh() {
  const group = new THREE.Group();
  const legs = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.38, 1.1, 32), fabricMaterial);
  legs.position.y = 0.15;
  group.add(legs);
  return group;
}

// Initialize default garment
let activeGarmentType = 'hoodie';
function switchGarment(type, el) {
  document.querySelectorAll('#panel-garments .asset-card').forEach(c => c.classList.remove('active'));
  if(el) el.classList.add('active');
  
  scene.remove(currentGarmentGroup);
  currentGarmentGroup = new THREE.Group();

  if(type === 'hoodie') currentGarmentGroup.add(createHoodieMesh());
  else if(type === 'tee') currentGarmentGroup.add(createTeeMesh());
  else if(type === 'puffer') currentGarmentGroup.add(createPufferMesh());
  else if(type === 'jeans') currentGarmentGroup.add(createJeansMesh());

  scene.add(currentGarmentGroup);
  activeGarmentType = type;
}
switchGarment('hoodie');

// --- CUSTOMIZATION LOGIC ---
function setGarmentColor(hex, el) {
  document.querySelectorAll('#panel-fabric .color-swatch').forEach(s => s.classList.remove('selected'));
  if(el) el.classList.add('selected');
  fabricMaterial.color.setHex(hex);
}

function setLogo(text) {
  // Dynamic Canvas Texture for Logos
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 54px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 128);

  const texture = new THREE.CanvasTexture(canvas);
  fabricMaterial.map = texture;
  fabricMaterial.needsUpdate = true;
}

// --- TOUCH & ORBIT CONTROLS ---
let isDragging = false;
let previousTouchPosition = { x: 0, y: 0 };

window.addEventListener('pointerdown', (e) => {
  if(e.clientY > window.innerHeight - 170) return; // Ignore toolbar clicks
  isDragging = true;
  previousTouchPosition = { x: e.clientX, y: e.clientY };
});

window.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const deltaX = e.clientX - previousTouchPosition.x;
  const deltaY = e.clientY - previousTouchPosition.y;

  currentGarmentGroup.rotation.y += deltaX * 0.01;
  baseAvatar.rotation.y += deltaX * 0.01;

  previousTouchPosition = { x: e.clientX, y: e.clientY };
});

window.addEventListener('pointerup', () => { isDragging = false; });

// UI Tabs switching
function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tool-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`panel-${tabId}`).classList.add('active');
}

// Modal Handling
function openPublishModal() { document.getElementById('modal').style.display = 'flex'; }
function closePublishModal() { document.getElementById('modal').style.display = 'none'; }

async function publishDesign() {
  const title = document.getElementById('designName').value || 'Untitled Collection';
  const creator = document.getElementById('designerName').value || 'Anonymous Creator';
  
  const designPayload = {
    title: title,
    creator: creator,
    garment: activeGarmentType,
    color: fabricMaterial.color.getHexString(),
    created_at: new Date()
  };

  if(supabaseClient) {
    const { error } = await supabaseClient.from('community_designs').insert([designPayload]);
    if(error) alert('Error saving to Supabase: ' + error.message);
    else alert('Design successfully published to Supabase community feed! 🚀');
  } else {
    alert('Design saved locally! (Connect Supabase keys to sync online).');
  }
  closePublishModal();
}

// Animation Loop
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
