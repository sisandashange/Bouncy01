<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MY BRAND STUDIO PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0f0f0f;color:#fff;overflow:hidden}
#top{height:52px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;background:#000;border-bottom:1px solid #333}
#top b{letter-spacing:1px}
#top button{background:#fff;color:#000;border:0;padding:8px 13px;border-radius:20px;font-weight:900}
#stageWrap{height:48vh;background:#1c1c1c;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#canvas{max-width:100%;max-height:100%;touch-action:none;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#tools{height:calc(100vh - 52px - 48vh);overflow-y:auto;padding:10px;background:#111}
.row{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.chip{background:#222;border:1px solid #333;color:#fff;padding:9px 13px;border-radius:14px;white-space:nowrap;font-weight:700;font-size:13px}
.chip.on{background:#FE2C55;border-color:#FE2C55}
.swatch{width:36px;height:36px;border-radius:50%;border:2px solid #fff;flex-shrink:0}
label{font-size:11px;opacity:.6;letter-spacing:1px;margin:10px 0 4px;display:block}
input[type=text],select{width:100%;padding:11px;border-radius:11px;border:1px solid #333;background:#222;color:#fff}
input[type=range]{width:100%}
.btnRow{display:flex;gap:8px}
.btnRow button{flex:1;padding:12px;border:0;border-radius:12px;font-weight:900;background:#222;color:#fff}
.btnRow button.primary{background:#FE2C55;color:#fff}
.layerItem{display:flex;justify-content:space-between;align-items:center;background:#1e1e1e;padding:9px 10px;border-radius:10px;margin-bottom:6px;font-size:13px}
.layerItem.active{border:1px solid #FE2C55}
</style>
</head>
<body>
<div id="top"><b>MY BRAND STUDIO PRO 👕</b><button onclick="exportPNG()">Download PNG ⬇️</button></div>
<div id="stageWrap"><canvas id="canvas" width="700" height="900"></canvas></div>
<div id="tools">
<label>1. GARMENT - REAL PHOTO</label>
<div class="row">
<button class="chip on" onclick="setGarment('hoodie',this)">Oversized Hoodie</button>
<button class="chip" onclick="setGarment('tee',this)">T-Shirt</button>
<button class="chip" onclick="setGarment('cap',this)">Cap</button>
<button class="chip" onclick="setGarment('sweater',this)">Sweater</button>
<button class="chip" onclick="document.getElementById('bgUpload').click()">📸 My Photo</button>
<input type="file" id="bgUpload" accept="image/*" hidden onchange="loadBG(event)">
</div>

<label>2. ADD LAYER</label>
<div class="btnRow">
<button onclick="addText()">+ TEXT</button>
<button onclick="document.getElementById('imgUpload').click()">+ PICTURE / LOGO</button>
<input type="file" id="imgUpload" accept="image/*" hidden onchange="addImage(event)">
<button onclick="duplicateLayer()">Duplicate</button>
<button onclick="deleteLayer()">🗑 Delete</button>
</div>

<label>3. EDIT SELECTED LAYER - Tap any design to select it</label>
<input type="text" id="textEdit" placeholder="Edit text..." oninput="updateText(this.value)">
<div class="row">
<select id="fontSel" onchange="setFont(this.value)" style="flex:1;padding:10px;border-radius:10px;background:#222;color:#fff;border:1px solid #333">
<option value="Arial Black">BOLD - Arial Black</option>
<option value="Impact">IMPACT Street</option>
<option value="Georgia">Classic Serif</option>
<option value="Courier New">Typewriter</option>
<option value="Verdana">Clean Modern</option>
<option value="Comic Sans MS">Playful</option>
</select>
<input type="color" id="colorPick" value="#ffffff" onchange="setColor(this.value)" style="width:50px;height:40px;border:0;background:none">
</div>
<label>SIZE • ROTATE • OPACITY</label>
<input type="range" min="20" max="180" value="60" oninput="setSize(this.value)">
<input type="range" min="-180" max="180" value="0" id="rotRange" oninput="setRot(this.value)">
<input type="range" min="20" max="100" value="100" oninput="setOpacity(this.value)">

<label>4. EFFECTS</label>
<div class="row">
<button class="chip" onclick="toggleStroke()">Outline ON/OFF</button>
<button class="chip" onclick="toggleShadow()">Shadow ON/OFF</button>
<button class="chip" onclick="bringForward()">Bring Forward</button>
<button class="chip" onclick="sendBack()">Send Back</button>
<button class="chip" onclick="removeBG()">✨ Remove BG (logo)</button>
</div>

<label>5. LAYERS - Tap to select</label>
<div id="layersList"></div>

<div class="btnRow" style="margin-top:10px">
<button onclick="undo()">↩ Undo</button>
<button onclick="clearAll()">Clear All</button>
<button class="primary" onclick="exportPNG()">⬇️ DOWNLOAD FOR FACTORY</button>
</div>
<p style="font-size:11px;opacity:.5;text-align:center;margin:10px 0">Drag to MOVE • Pinch / Slider to RESIZE • Slider to ROTATE<br>Tip: Tap STRICT to move it off-center, like real brands do.</p>
</div>

<script>
const cv=document.getElementById('canvas'), ctx=cv.getContext('2d');
let bgImg=new Image(); bgImg.crossOrigin='anonymous';
let garments={
 hoodie:'https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=800&q=80',
 tee:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=800&q=80',
 cap:'https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=800&q=80',
 sweater:'https://images.unsplash.com/photo-1576871337622-98d48d1cf531?w=800&q=80'
};
let layers=[], selected=-1, history=[];
function setGarment(t,el){ document.querySelectorAll('.chip').forEach(c=>{if(['Oversized','T-Shirt','Cap','Sweater'].some(x=>c.textContent.includes(x)))c.classList.remove('on')}); if(el)el.classList.add('on'); loadBGImg(garments[t]); }
function loadBGImg(src){ bgImg=new Image(); bgImg.crossOrigin='anonymous'; bgImg.onload=draw; bgImg.src=src; }
function loadBG(e){ let f=e.target.files[0]; if(!f)return; let u=URL.createObjectURL(f); loadBGImg(u); }
function saveHist(){ history.push(JSON.stringify(layers)); if(history.length>20)history.shift(); }
function undo(){ if(!history.length)return; layers=JSON.parse(history.pop()); draw(); renderLayers(); }
function addText(){ saveHist(); layers.push({type:'text',text:'STRICT',x:350,y:450,size:60,font:'Arial Black',color:'#ffffff',rot:0,opacity:1,stroke:false,shadow:false}); selected=layers.length-1; draw(); renderLayers(); }
function addImage(e){ let f=e.target.files[0]; if(!f)return; let u=URL.createObjectURL(f); let im=new Image(); im.onload=()=>{ saveHist(); layers.push({type:'image',img:im,url:u,x:350,y:400,w:220,h:220,rot:0,opacity:1}); selected=layers.length-1; draw(); renderLayers(); }; im.src=u; }
function updateText(v){ if(selected<0)return; layers[selected].text=v; draw(); }
function setFont(f){ if(selected<0)return; layers[selected].font=f; draw(); }
function setColor(c){ if(selected<0)return; layers[selected].color=c; draw(); }
function setSize(v){ if(selected<0)return; if(layers[selected].type==='text') layers[selected].size=+v; else { layers[selected].w=+v*3; layers[selected].h=+v*3; } draw(); }
function setRot(v){ if(selected<0)return; layers[selected].rot=+v; draw(); }
function setOpacity(v){ if(selected<0)return; layers[selected].opacity=v/100; draw(); }
function toggleStroke(){ if(selected<0)return; layers[selected].stroke=!layers[selected].stroke; draw(); }
function toggleShadow(){ if(selected<0)return; layers[selected].shadow=!layers[selected].shadow; draw(); }
function bringForward(){ if(selected<0||selected===layers.length-1)return; let t=layers.splice(selected,1)[0]; layers.splice(selected+1,0,t); selected++; draw(); renderLayers(); }
function sendBack(){ if(selected<=0)return; let t=layers.splice(selected,1)[0]; layers.splice(selected-1,0,t); selected--; draw(); renderLayers(); }
function duplicateLayer(){ if(selected<0)return; saveHist(); let c=JSON.parse(JSON.stringify(layers[selected])); if(c.type==='image') c.img=layers[selected].img; c.x+=30; c.y+=30; layers.push(c); selected=layers.length-1; draw(); renderLayers(); }
function deleteLayer(){ if(selected<0)return; saveHist(); layers.splice(selected,1); selected=-1; draw(); renderLayers(); }
function clearAll(){ saveHist(); layers=[]; selected=-1; draw(); renderLayers(); }
// REMOVE BACKGROUND - removes white / light background from logo
function removeBG(){
 if(selected<0||layers[selected].type!=='image') return alert('Select a PICTURE layer first, then tap Remove BG');
 let L=layers[selected]; let c=document.createElement('canvas'); c.width=L.img.naturalWidth; c.height=L.img.naturalHeight; let x=c.getContext('2d'); x.drawImage(L.img,0,0);
 let d=x.getImageData(0,0,c.width,c.height); let data=d.data;
 for(let i=0;i<data.length;i+=4){ if(data[i]>200&&data[i+1]>200&&data[i+2]>200) data[i+3]=0; }
 x.putImageData(d,0,0); let ni=new Image(); ni.onload=()=>{ L.img=ni; draw(); }; ni.src=c.toDataURL(); alert('✨ Background removed! White background is now transparent.');
}
function renderLayers(){ let el=document.getElementById('layersList'); el.innerHTML=''; layers.forEach((l,i)=>{ let div=document.createElement('div'); div.className='layerItem'+(i===selected?' active':''); div.innerHTML=`<span>${l.type==='text'?'🔤 ':'🖼 '} ${l.type==='text'?l.text:'Picture'}</span><span>↕ ${i}</span>`; div.onclick=()=>{selected=i; draw(); renderLayers();}; el.appendChild(div); }); }
// DRAG + PINCH - MOVEABLE DESIGN
let dragging=false, lastX=0, lastY=0, lastDist=0;
function getPos(e){ let r=cv.getBoundingClientRect(); let t=e.touches?e.touches[0]:e; return {x:(t.clientX-r.left)*(cv.width/r.width), y:(t.clientY-r.top)*(cv.height/r.height)}; }
cv.addEventListener('touchstart',e=>{ if(e.touches.length===2){ lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); return; } let p=getPos(e); for(let i=layers.length-1;i>=0;i--){ let l=layers[i]; let dx=p.x-l.x, dy=p.y-l.y; if(Math.abs(dx)<120&&Math.abs(dy)<90){ selected=i; dragging=true; lastX=p.x; lastY=p.y; document.getElementById('textEdit').value=l.type==='text'?l.text:''; document.getElementById('rotRange').value=l.rot||0; renderLayers(); draw(); break; } } });
cv.addEventListener('touchmove',e=>{ e.preventDefault(); if(e.touches.length===2&&selected>=0){ let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); let diff=d-lastDist; lastDist=d; let l=layers[selected]; if(l.type==='text') l.size=Math.max(20,Math.min(180,l.size+diff*0.2)); else { l.w=Math.max(40,l.w+diff); l.h=Math.max(40,l.h+diff); } draw(); return; } if(!dragging||selected<0)return; let p=getPos(e); layers[selected].x+=p.x-lastX; layers[selected].y+=p.y-lastY; lastX=p.x; lastY=p.y; draw(); },{passive:false});
cv.addEventListener('touchend',()=>dragging=false);
cv.addEventListener('mousedown',e=>{ let p=getPos(e); for(let i=layers.length-1;i>=0;i--){ let l=layers[i]; if(Math.abs(p.x-l.x)<120&&Math.abs(p.y-l.y)<90){ selected=i; dragging=true; lastX=p.x; lastY=p.y; renderLayers(); draw(); break; } } });
cv.addEventListener('mousemove',e=>{ if(!dragging||selected<0)return; let p=getPos(e); layers[selected].x+=p.x-lastX; layers[selected].y+=p.y-lastY; lastX=p.x; lastY=p.y; draw(); });
addEventListener('mouseup',()=>dragging=false);
function draw(){
 ctx.clearRect(0,0,cv.width,cv.height);
 if(bgImg.complete&&bgImg.naturalWidth){ ctx.drawImage(bgImg,0,0,cv.width,cv.height); } else { ctx.fillStyle='#222'; ctx.fillRect(0,0,cv.width,cv.height); }
 layers.forEach((l,i)=>{
  ctx.save(); ctx.globalAlpha=l.opacity||1; ctx.translate(l.x,l.y); ctx.rotate((l.rot||0)*Math.PI/180);
  if(l.shadow){ ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=12; ctx.shadowOffsetY=6; }
  if(l.type==='text'){ ctx.font=`900 ${l.size}px ${l.font}`; ctx.textAlign='center'; ctx.textBaseline='middle'; if(l.stroke){ ctx.lineWidth=5; ctx.strokeStyle='#000'; ctx.strokeText(l.text,0,0); } ctx.fillStyle=l.color; ctx.fillText(l.text,0,0); }
  else { ctx.drawImage(l.img,-l.w/2,-l.h/2,l.w,l.h); }
  ctx.restore();
  if(i===selected){ ctx.save(); ctx.strokeStyle='#FE2C55'; ctx.lineWidth=3; ctx.setLineDash([10,8]); ctx.strokeRect(l.x-130,l.y-90,260,180); ctx.restore(); }
 });
}
function exportPNG(){ let a=document.createElement('a'); a.download='my-brand-design.png'; a.href=cv.toDataURL('image/png'); a.click(); alert('✅ Downloaded! Send this PNG to your printer / Printful.'); }
// Start with STRICT like your screenshot, but now MOVEABLE
loadBGImg(garments.hoodie);
setTimeout(()=>{ layers.push({type:'text',text:'STRICT',x:350,y:450,size:62,font:'Arial Black',color:'#ffffff',rot:0,opacity:1,stroke:false,shadow:false}); layers.push({type:'text',text:'PIETERMARITZBURG • 2026',x:350,y:500,size:22,font:'Arial Black',color:'#ffffff',rot:0,opacity:1}); selected=0; draw(); renderLayers(); },500);
</script>
</body>
</html>
