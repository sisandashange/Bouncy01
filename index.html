<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#020617">
<title>BOUNCY CHAT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* --- GRAND FINALE DESIGN SYSTEM --- */
:root {
    --glass-bg: rgba(15, 23, 42, 0.6);
    --glass-border: rgba(255, 255, 255, 0.06);
    --primary: #6366f1;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --radius-lg: 28px;
    --radius-md: 22px;
    --tier-warm: #f59e0b;
    --tier-cool: #6366f1;
    --tier-new: #94a3b8;
}

* { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
body {
    margin: 0;
    background: #020617;
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    height: 100dvh;
    overflow: hidden;
}

/* PARALLAX CANVAS BACKGROUND */
#liquidCanvas {
    position: fixed; top: 0; left: 0; width: 100vw; height: 120vh;
    z-index: -1; pointer-events: none; transition: transform 0.1s linear;
}

/* GLASSMORPHISM */
.glass-panel {
    background: var(--glass-bg);
    backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border: 1px solid var(--glass-border);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

/* LAYOUT */
.app-container {
    height: 100dvh; max-width: 1600px; margin: 0 auto;
    display: grid; grid-template-columns: 380px 1fr; position: relative; z-index: 1;
}

/* SIDEBAR */
.sidebar { border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; background: rgba(2, 6, 23, 0.5); }
.side-head { padding: 24px; display: flex; justify-content: space-between; align-items: center; }
.brand { font-family: 'Space Grotesk'; font-weight: 700; font-size: 26px; letter-spacing: -1px; }
.brand span { color: var(--primary); text-shadow: 0 0 20px rgba(99,102,241,0.5); transition: color 0.5s, text-shadow 0.5s; }

.search-wrap { padding: 0 24px 20px; position: relative; }
.search-input { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); padding: 14px 14px 14px 45px; border-radius: 16px; color: white; font-size: 14px; transition: 0.3s; }
.search-input:focus { background: rgba(0,0,0,0.4); border-color: var(--primary); }
.search-wrap::before { content:'🔍'; position:absolute; left:40px; top:14px; opacity:0.4; font-size:14px; }

.chat-list { flex:1; overflow-y:auto; padding: 10px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }
.chat-row {
    width:100%; display:flex; align-items:center; gap:16px; padding:16px;
    border-radius: 18px; margin-bottom: 8px; text-align:left; transition:0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid transparent; position: relative; overflow: hidden;
}
.chat-row:hover { background: rgba(255,255,255,0.03); border-color: var(--glass-border); transform: translateX(4px); }
.chat-row.active { background: rgba(99,102,241,0.12); border-color: rgba(99,102,241,0.3); }
.chat-row.active::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--primary); border-radius:0 4px 4px 0; }

.avatar {
    width:52px; height:52px; border-radius:18px; background:linear-gradient(135deg,#334155,#1e293b);
    display:grid; place-items:center; font-weight:700; color:white; overflow:hidden; flex-shrink:0;
    border: 1px solid var(--glass-border); transition: transform 0.3s;
}
.chat-row:hover .avatar { transform: scale(1.05); }
.avatar img { width:100%; height:100%; object-fit:cover; }
.chat-meta { flex:1; min-width:0; }
.chat-name { font-weight:600; font-size:15px; margin-bottom:6px; display:flex; justify-content:space-between; }
.chat-preview { color:var(--text-muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition: color 0.3s; }
.chat-time { font-size:11px; color:var(--text-muted); }

.side-footer { padding:20px; border-top:1px solid var(--glass-border); display:flex; align-items:center; gap:12px; background:rgba(0,0,0,0.2); }

/* CHAT AREA */
.chat-area { display:flex; flex-direction:column; position:relative; }
.empty-state { height:100%; display:grid; place-items:center; text-align:center; color:var(--text-muted); }
.chat-header {
    padding:20px 30px; border-bottom:1px solid var(--glass-border); display:flex; align-items:center; gap:16px;
    background: rgba(2, 6, 23, 0.7); backdrop-filter:blur(20px); transition: background 0.5s;
}
.header-info { flex:1; }
.header-name { font-weight:700; font-size:17px; font-family:'Space Grotesk'; }
.header-status { font-size:12px; color:var(--primary); margin-top:2px; transition: color 0.5s; }

.messages-container { flex:1; overflow-y:auto; padding:30px; display:flex; flex-direction:column; gap:16px; perspective: 1000px; }

/* EXPRESSIVE BUBBLES WITH PHYSICS */
.bubble {
    max-width:70%; padding:14px 20px; border-radius:22px; line-height:1.5;
    position:relative; font-size:15px; word-wrap:break-word;
    animation: bubbleLand 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: bottom center;
    transition: all 0.3s ease;
}
@keyframes bubbleLand { 
    0% { transform:scale(0.5) translateY(30px) rotateX(10deg); opacity:0; } 
    60% { transform:scale(1.05) translateY(-5px) rotateX(0deg); } 
    100% { transform:scale(1) translateY(0) rotateX(0deg); opacity:1; } 
}

.bubble.in { align-self:flex-start; background:rgba(30,41,59,0.8); border-bottom-left-radius:6px; border:1px solid var(--glass-border); }
.bubble.out { align-self:flex-end; background:linear-gradient(135deg,var(--primary),#8b5cf6); border-bottom-right-radius:6px; box-shadow:0 4px 20px rgba(99,102,241,0.3); }

/* INTENSITY VARIANTS */
.bubble.whisper { font-size: 13px; opacity: 0.8; padding: 10px 16px; font-weight: 300; }
.bubble.shout { font-size: 17px; font-weight: 700; padding: 16px 24px; box-shadow: 0 8px 30px rgba(99,102,241,0.5); }

.msg-time { display:block; font-size:10px; margin-top:8px; opacity:0.7; text-align:right; }

/* VOICE SCULPTURE STYLES */
.voice-sculpture {
    display: flex; align-items: center; gap: 10px; min-width: 180px;
}
.voice-waveform {
    flex: 1; height: 32px; display: flex; align-items: center; gap: 2px;
}
.wave-bar {
    width: 3px; background: currentColor; border-radius: 2px; opacity: 0.7;
    transition: height 0.1s ease;
}
.voice-play-btn {
    width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.1);
    display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
    transition: transform 0.2s;
}
.voice-play-btn:hover { transform: scale(1.1); background: rgba(255,255,255,0.2); }
.voice-duration { font-size: 12px; opacity: 0.8; min-width: 40px; text-align: right; }

/* COMPOSER */
.composer { padding:20px 30px; border-top:1px solid var(--glass-border); display:flex; gap:12px; align-items:center; background:rgba(2,6,23,0.7); backdrop-filter:blur(20px); transition: 0.3s; }
.composer:focus-within { background: rgba(2,6,23,0.9); padding: 25px 30px; }
.msg-input { flex:1; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); border-radius:30px; padding:14px 24px; color:white; font-size:15px; transition: 0.3s; }
.msg-input:focus { background:rgba(255,255,255,0.1); border-color: var(--primary); }
.send-btn { 
    width:50px; height:50px; border-radius:50%; background:var(--primary); color:white; 
    display:grid; place-items:center; font-size:20px; box-shadow:0 4px 15px rgba(99,102,241,0.4); 
    transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1); 
}
.send-btn:active { transform: scale(0.9); }
.send-btn:hover { transform: scale(1.1) rotate(-10deg); }
.voice-record-btn {
    width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border); display: grid; place-items: center;
    font-size: 20px; transition: 0.2s;
}
.voice-record-btn:hover { background: rgba(255,255,255,0.1); transform: scale(1.1); }
.voice-record-btn.recording { background: #ef4444; border-color: #ef4444; animation: pulseRecord 1s infinite; }
@keyframes pulseRecord { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); } 50% { box-shadow: 0 0 0 10px rgba(239,68,68,0); } }

/* AUTH & MODALS */
.auth-wrap { height:100dvh; display:grid; place-items:center; padding:20px; }
.auth-card { width:100%; max-width:400px; padding:40px; border-radius:var(--radius-lg); text-align:center; }
.field { width:100%; background:rgba(0,0,0,0.3); border:1px solid var(--glass-border); padding:16px; border-radius:16px; color:white; margin-bottom:15px; }
.primary-btn { width:100%; background:var(--primary); color:white; padding:16px; border-radius:16px; font-weight:600; margin-top:10px; box-shadow:0 4px 20px rgba(99,102,241,0.3); transition: 0.3s; }
.primary-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(99,102,241,0.5); }
.hidden { display:none!important; }
button { cursor:pointer; border:0; background:none; color:inherit; font-family:inherit; }
.icon-btn { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; color:var(--text-muted); font-size:20px; transition: 0.2s; }
.icon-btn:hover { background:rgba(255,255,255,0.05); color:white; transform: scale(1.1); }

@media(max-width:768px) {
    .app-container { grid-template-columns:1fr; }
    .chat-area { display:none; position:absolute; inset:0; z-index:10; background:#020617; }
    .app-container.chat-open .sidebar { display:none; }
    .app-container.chat-open .chat-area { display:flex; }
    .back-btn { display:block!important; margin-right:10px; }
    .back-btn { display:none; }
}
</style>
</head>
<body>

<!-- PARALLAX LIQUID BACKGROUND -->
<canvas id="liquidCanvas"></canvas>

<!-- AUTH VIEW -->
<div id="auth" class="auth-wrap">
    <div class="auth-card glass-panel">
        <div class="brand" style="justify-content:center; font-size:36px; margin-bottom:20px;">BOUNCY<span>.</span></div>
        <h1 style="font-family:'Space Grotesk'; margin:10px 0;">Welcome Back</h1>

        </div>

</div>

<!-- MAIN APP -->
<div id="app" class="app-container hidden">
    <aside class="sidebar">
        <div class="side-head">
            <div class="brand">BOUNCY<span>.</span></div>
            <button class="icon-btn" id="newChatBtn">✎</button>
        </div>

        <div id="chatList" class="chat-list"></div>
        <div class="side-footer">

                <div id="myName" style="font-weight:600; font-size:14px;">User</div>
                <div id="myHandle" style="font-size:12px; color:var(--text-muted);">@handle</div>

        </div>
    </aside>

    <main class="chat-area">
        <div id="noChat" class="empty-state">
            <div>
                <div style="font-size:60px; margin-bottom:20px; opacity:0.2;">💬</div>
                <h2 style="font-family:'Space Grotesk'; margin-bottom:10px;">Select a conversation</h2>
                <p>Choose a friend or start a new chat.</p>
            </div>
        </div>
        <div id="chatPanel" class="hidden" style="display:flex; flex-direction:column; height:100%;">
            <header class="chat-header">
                <button class="icon-btn back-btn" id="backChats">←</button>
                <div id="peerAvatar" class="avatar" style="width:44px; height:44px;"></div>
                <div class="header-info">
                    <div id="peerName" class="header-name">User</div>
                    <div id="peerStatus" class="header-status">Online</div>

            </header>
            <div id="messages" class="messages-container"></div>
            <form id="composer" class="composer">
                <button type="button" class="voice-record-btn" id="recordVoice">🎙</button>
                <input id="messageInput" class="msg-input" placeholder="Type a message..." autocomplete="off">
                <button type="submit" class="send-btn">➤</button>
            </form>
        </div>
    </main>
</div>

<script>
// --- PARALLAX LIQUID ANIMATION ENGINE ---
const canvas = document.getElementById('liquidCanvas');
const ctx = canvas.getContext('2d');
let width, height, scrollY = 0;
let particles = [];
let pulseIntensity = 0;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight * 1.2;
}
window.addEventListener('resize', resize);
window.addEventListener('scroll', () => { scrollY = window.scrollY; }, {passive: true});
resize();

class Particle {
    constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.radius = Math.random() * 250 + 150;
        this.depth = Math.random() * 0.5 + 0.5;
        const colors = ['rgba(99, 102, 241, 0.3)', 'rgba(139, 92, 246, 0.25)', 'rgba(59, 130, 246, 0.2)', 'rgba(15, 23, 42, 0.6)'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.baseRadius = this.radius;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        if (pulseIntensity > 0) {
            this.radius = this.baseRadius + (pulseIntensity * 20 * this.depth);
            pulseIntensity *= 0.95;
        } else {
            this.radius = this.baseRadius;
        }
        
        if(this.x < -this.radius) this.x = width + this.radius;
        if(this.x > width + this.radius) this.x = -this.radius;
        if(this.y < -this.radius) this.y = height + this.radius;
        if(this.y > height + this.radius) this.y = -this.radius;
    }
    draw() {
        const parallaxY = this.y - (scrollY * this.depth * 0.1);
        ctx.beginPath();
        ctx.arc(this.x, parallaxY, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
    }
}

for(let i=0; i<15; i++) particles.push(new Particle());

function animate() {
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = '#020617';
    ctx.fillRect(0,0,width,height);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
}
animate();

function triggerPulse(intensity = 1.0) {
    pulseIntensity = intensity;
}

// --- VOICE SCULPTURE GENERATOR ---
function generateWaveform(container, duration = 30) {
    container.innerHTML = '';
    const barCount = Math.min(duration * 2, 60);
    for (let i = 0; i < barCount; i++) {
        const bar = document.createElement('div');
        bar.className = 'wave-bar';
        // Simulate realistic waveform heights
        const height = Math.random() * 20 + 8;
        bar.style.height = `${height}px`;
        container.appendChild(bar);
    }
}

function createVoiceSculpture(audioUrl, duration) {
    const wrapper = document.createElement('div');
    wrapper.className = 'voice-sculpture';
    
    const playBtn = document.createElement('div');
    playBtn.className = 'voice-play-btn';
    playBtn.innerHTML = '▶';
    
    const waveform = document.createElement('div');
    waveform.className = 'voice-waveform';
    generateWaveform(waveform, duration);
    
    const durLabel = document.createElement('div');
    durLabel.className = 'voice-duration';
    durLabel.textContent = `0:${duration.toString().padStart(2, '0')}`;
    
    wrapper.append(playBtn, waveform, durLabel);
    
    let isPlaying = false;
    let audio = null;
    
    playBtn.onclick = () => {
        if (!audio && audioUrl) {
            audio = new Audio(audioUrl);
            audio.onended = () => {
                isPlaying = false;
                playBtn.innerHTML = '▶';
                resetWaveform(waveform);
            };
        }
        
        if (isPlaying) {
            audio?.pause();
            isPlaying = false;
            playBtn.innerHTML = '▶';
            resetWaveform(waveform);
        } else {
            audio?.play();
            isPlaying = true;
            playBtn.innerHTML = '⏸';
            animateWaveform(waveform);
            triggerPulse(0.5); // Subtle pulse during playback
        }
    };
    
    return wrapper;
}

function animateWaveform(container) {
    const bars = container.querySelectorAll('.wave-bar');
    bars.forEach((bar, i) => {
        setInterval(() => {
            const h = Math.random() * 24 + 6;
            bar.style.height = `${h}px`;
        }, 100 + (i * 10));
    });
}

function resetWaveform(container) {
    const bars = container.querySelectorAll('.wave-bar');
    bars.forEach(bar => {
        bar.style.height = `${Math.random() * 20 + 8}px`;
    });
}

// --- EXPRESSIVE MESSAGE LOGIC ---
function getMessageIntensity(text) {
    if (!text) return 'normal';
    const upperRatio = (text.match(/[A-Z]/g) || []).length / text.length;
    const exclCount = (text.match(/!/g) || []).length;
    const isLower = text === text.toLowerCase() && text.length > 3;
    
    if (upperRatio > 0.6 || exclCount > 2) return 'shout';
    if (isLower && !text.includes('.') && !text.includes('!') && !text.includes('?')) return 'whisper';
    return 'normal';
}

// --- RELATIONSHIP TIER LOGIC ---
function getRelationshipTier(peerId, messageCount) {
    if (messageCount > 50) return 'warm';
    if (messageCount > 10) return 'cool';
    return 'new';
}

function applyTierTheme(tier) {
    const root = document.documentElement;
    switch(tier) {
        case 'warm': root.style.setProperty('--primary', 'var(--tier-warm)'); break;
        case 'cool': root.style.setProperty('--primary', 'var(--tier-cool)'); break;
        default: root.style.setProperty('--primary', 'var(--tier-new)');
    }
}

// --- APP LOGIC (FINAL VERSION) ---
const SUPABASE_URL = 'https://lakupnehsetdazezlsrs.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_3ePLMRIKVNms7Qi461FQXw_x2TGc75s';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

let user=null, profile=null, activeConversation=null, conversations=[], currentPeerColor='#6366f1';
let mediaRecorder = null, audioChunks = [];

function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#ef4444;color:white;padding:12px 24px;border-radius:30px;font-weight:600;z-index:999;';document.body.appendChild(t);setTimeout(()=>t.remove(),3000);}
function initials(n){return(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();}
function timeLabel(d){return new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function showAuth(){$('auth').classList.remove('hidden');$('app').classList.add('hidden');}
function showApp(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');}

$('authForm').onsubmit=async e=>{
    e.preventDefault();
    const email=$('email').value.trim(), password=$('password').value;
    try{
        const {data,error}=await sb.auth.signInWithPassword({email,password});
        if(error) throw error;
        await boot(data.user);
    }catch(err){toast(err.message)}
};

async function boot(u){
    user=u;
    const {data:p}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();
    profile=p;
    $('myName').textContent=profile?.display_name||'User';
    $('myHandle').textContent='@'+(profile?.username||'');
    $('myAvatar').innerHTML=profile?.avatar_url?`<img src="${esc(profile.avatar_url)}">`:initials(profile?.display_name);
    showApp();
    loadConversations();
}

async function loadConversations(){
    if(!user)return;
    const {data:members}=await sb.from('conversation_members').select('conversation_id').eq('user_id',user.id);
    if(!members||!members.length){renderConversations([]);return;}
    const ids=members.map(m=>m.conversation_id);
    const {data:convos}=await sb.from('conversations').select('*').in('id',ids).order('created_at',{ascending:false});
    const enriched=[];
    for(const c of(convos||[])){
        const {data:mems}=await sb.from('conversation_members').select('user_id').eq('conversation_id',c.id);
        const peerId=mems?.find(m=>m.user_id!==user.id)?.user_id;
        let peer=null;
        if(peerId){const {data:pd}=await sb.from('profiles').select('*').eq('id',peerId).single();peer=pd;}
        const {data:last}=await sb.from('messages').select('*').eq('conversation_id',c.id).order('created_at',{ascending:false}).limit(1);
        const {count} = await sb.from('messages').select('*', {count:'exact', head:true}).eq('conversation_id',c.id);
        enriched.push({...c,peer,last:last?.[0], msgCount: count || 0});
    }
    conversations=enriched;
    renderConversations(conversations);
}

function renderConversations(list){
    $('chatList').innerHTML=list.map(c=>{
        const name=c.peer?c.peer.display_name:(c.title||'Group');
        const sub=c.last?(c.last.sender_id===user.id?'You: ':'')+(c.last.body||'Media'):'Start chatting';
        const isActive=c.id===activeConversation?'active':'';
        const av=c.peer?.avatar_url?`<img src="${esc(c.peer.avatar_url)}">`:initials(name);
        return `<button class="chat-row ${isActive}" onclick="openConversation('${c.id}')"><div class="avatar">${av}</div><div class="chat-meta"><div class="chat-name"><span>${esc(name)}</span><span class="chat-time">${c.last?timeLabel(c.last.created_at):''}</span></div><div class="chat-preview">${esc(sub)}</div></div></button>`;
    }).join('');
}

async function openConversation(id){
    activeConversation=id;
    const convo=conversations.find(c=>c.id===id);
    activePeer=convo?.peer;
    
    const tier = getRelationshipTier(activePeer?.id, convo?.msgCount || 0);
    applyTierTheme(tier);
    
    $('noChat').classList.add('hidden');
    $('chatPanel').classList.remove('hidden');
    $('chatPanel').style.display='flex';
    const name=activePeer?activePeer.display_name:(convo?.title||'Unknown');
    $('peerName').textContent=name;
    $('peerStatus').textContent=activePeer?'@'+activePeer.username:'Group Chat';
    $('peerAvatar').innerHTML=activePeer?.avatar_url?`<img src="${esc(activePeer.avatar_url)}">`:initials(name);
    $('app').classList.add('chat-open');
    loadMessages();
    subscribeMessages(id);
}

$('backChats').onclick=()=>$('app').classList.remove('chat-open');

async function loadMessages(){
    if(!activeConversation)return;
    const {data}=await sb.from('messages').select('*').eq('conversation_id',activeConversation).order('created_at',{ascending:true}).limit(100);
    renderMessages(data||[]);
}

function renderMessages(rows){
    const box=$('messages');
    box.innerHTML='';
    rows.forEach(m => {
        const mine=m.sender_id===user.id;
        const bubble = document.createElement('div');
        bubble.className = `bubble ${mine?'out':'in'}`;
        
        if (m.message_type === 'voice') {
            const sculpture = createVoiceSculpture(m.media_url, m.duration || 15);
            bubble.appendChild(sculpture);
        } else {
            const intensity = getMessageIntensity(m.body);
            if (intensity !== 'normal') bubble.classList.add(intensity);
            bubble.innerHTML = `${esc(m.body||'')}<span class="msg-time">${timeLabel(m.created_at)}</span>`;
        }
        
        box.appendChild(bubble);
    });
    box.scrollTop=box.scrollHeight;
}

function subscribeMessages(id){
    sb.channel('chat-'+id)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`conversation_id=eq.${id}`}, payload => {
          loadMessages();
          loadConversations();
          triggerPulse(payload.new.message_type === 'voice' ? 1.5 : 1.0);
          const chatArea = document.querySelector('.chat-area');
          chatArea.style.animation = 'none';
          void chatArea.offsetWidth;
          chatArea.style.animation = 'hapticShake 0.3s ease';
      })
      .subscribe();
}

// Add haptic shake keyframes dynamically
const styleSheet = document.createElement("style");
styleSheet.innerText = `
@keyframes hapticShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-2px); }
    75% { transform: translateX(2px); }
}`;
document.head.appendChild(styleSheet);

$('composer').onsubmit=async e=>{
    e.preventDefault();
    const input=$('messageInput');
    const body=input.value.trim();
    if(!body||!activeConversation)return;
    input.value='';
    await sb.from('messages').insert({conversation_id:activeConversation,sender_id:user.id,body,message_type:'text'});
    triggerPulse(1.0);
};

// Voice Recording Logic
let isRecording = false;
$('recordVoice').onclick = async () => {
    if (!isRecording) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const path = `${activeConversation}/${user.id}/${Date.now()}.webm`;
                const { error: uploadErr } = await sb.storage.from('voice').upload(path, blob);
                if (uploadErr) { toast('Upload failed'); return; }
                
                const duration = Math.floor(blob.size / 16000); // Approximate duration
                await sb.from('messages').insert({
                    conversation_id: activeConversation,
                    sender_id: user.id,
                    body: 'Voice message',
                    message_type: 'voice',
                    media_url: path,
                    duration: duration
                });
                triggerPulse(1.5);
            };
            mediaRecorder.start();
            isRecording = true;
            $('recordVoice').classList.add('recording');
            $('recordVoice').textContent = '⏹';
        } catch (err) {
            toast('Microphone access denied');
        }
    } else {
        mediaRecorder?.stop();
        mediaRecorder?.stream?.getTracks().forEach(t => t.stop());
        isRecording = false;
        $('recordVoice').classList.remove('recording');
        $('recordVoice').textContent = '🎙';
    }
};

$('signOut').onclick=async()=>{await sb.auth.signOut();user=null;showAuth();};

(async()=>{const {data}=await sb.auth.getSession();if(data.session)await boot(data.session.user);else showAuth();})();
</script>
