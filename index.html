<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Markmaker: design your brand</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=Sora:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=Manrope:wght@500;800&family=Playfair+Display:wght@500;700&family=Lato:wght@400;700&family=Cormorant+Garamond:wght@500;700&family=Fredoka:wght@500;600&family=Nunito:wght@400;700&family=Archivo+Black&family=Work+Sans:wght@400;600&family=Fraunces:wght@500;700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f3ee;
      --card: #fff;
      --ink: #15140f;
      --mute: #6a675e;
      --line: #e2ded3;
      --acc: #ff5a36;
      --onacc: #fff;
      --f: 'Bricolage Grotesque', system-ui, sans-serif;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e0e0c;
        --card: #181815;
        --ink: #f3f1ea;
        --mute: #a09d92;
        --line: #2c2b26;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0e0e0c;
      --card: #181815;
      --ink: #f3f1ea;
      --mute: #a09d92;
      --line: #2c2b26;
      color-scheme: dark;
    }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 500 16px/1.45 var(--f);
      -webkit-font-smoothing: antialiased;
    }
    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--acc);
      outline-offset: 2px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      max-width: 1240px;
      margin: auto;
    }
    .logo {
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -.04em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo i {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--acc);
      display: block;
      animation: hop 1.1s ease-in-out infinite alternate;
    }
    @keyframes hop { to { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { .logo i { animation: none; } }
    .sp { flex: 1; }
    .ghost {
      border: 1.5px solid var(--line);
      border-radius: 20px;
      padding: 8px 14px;
      font-weight: 800;
      font-size: 14px;
    }
    .wrap {
      max-width: 1240px;
      margin: auto;
      padding: 0 18px 60px;
      display: grid;
      gap: 18px;
    }
    @media (min-width: 960px) {
      .wrap { grid-template-columns: 340px 1fr; align-items: start; }
      #ctl { position: sticky; top: 12px; }
    }
    h1 {
      font-size: clamp(34px, 6vw, 60px);
      line-height: 1;
      letter-spacing: -.045em;
      margin: 6px 0 10px;
      font-weight: 800;
    }
    .lead {
      color: var(--mute);
      margin: 0 0 18px;
      max-width: 46ch;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px;
    }
    label, .lb {
      display: block;
      font-size: 13px;
      font-weight: 800;
      color: var(--mute);
      margin: 14px 0 6px;
      letter-spacing: .02em;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      font: inherit;
      color: var(--ink);
      background: var(--bg);
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .chip {
      border: 1.5px solid var(--line);
      border-radius: 18px;
      padding: 7px 13px;
      font-size: 14px;
      font-weight: 700;
    }
    .chip[aria-pressed=true] {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }
    .btn {
      display: block;
      width: 100%;
      min-height: 50px;
      border-radius: 15px;
      background: var(--acc);
      color: var(--onacc);
      font-weight: 800;
      font-size: 16px;
      margin-top: 16px;
    }
    .btn.alt {
      background: var(--bg);
      color: var(--ink);
      border: 1.5px solid var(--line);
      margin-top: 8px;
    }
    .sec { margin-bottom: 16px; }
    .sh {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .sh h2 {
      flex: 1;
      font-size: 20px;
      letter-spacing: -.02em;
      margin: 0;
    }
    .sh button {
      border: 1.5px solid var(--line);
      border-radius: 16px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 800;
    }
    .sh button[aria-pressed=true] {
      background: var(--ink);
      color: var(--bg);
    }
    .brand { font-family: var(--bf); }
    .stage {
      border-radius: 16px;
      padding: 34px 18px;
      display: grid;
      place-items: center;
      gap: 18px;
      border: 1px solid var(--line);
    }
    .lk {
      display: flex;
      align-items: center;
      gap: .5em;
    }
    .lk.stack {
      flex-direction: column;
      text-align: center;
      gap: .35em;
    }
    .wm {
      font-family: var(--hf);
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      text-transform: var(--up);
      letter-spacing: var(--ls);
    }
    .pal {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .sw {
      border-radius: 14px;
      min-height: 110px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--line);
    }
    .sw b {
      font-size: 13px;
      display: block;
    }
    @media (max-width: 560px) {
      .pal { grid-template-columns: repeat(2, 1fr); }
      .sw:last-child { grid-column: span 2; }
    }
    .type { display: grid; gap: 14px; }
    @media (min-width: 700px) { .type { grid-template-columns: 200px 1fr; } }
    .aa {
      font-family: var(--hf);
      font-size: 92px;
      line-height: 1;
      font-weight: 700;
      border-radius: 16px;
      padding: 18px;
      display: grid;
      place-items: center;
    }
    .apps { display: grid; gap: 14px; }
    @media (min-width: 700px) {
      .apps { grid-template-columns: 1fr 1fr; }
      .wide { grid-column: 1 / -1; }
    }
    .bc {
      aspect-ratio: 1.75;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .16);
      overflow: hidden;
      position: relative;
    }
    .bc .role {
      font-family: var(--hf);
      font-weight: 700;
      font-size: 17px;
    }
    .bc small {
      display: block;
      font-size: 12px;
      opacity: .85;
      line-height: 1.5;
    }
    .post {
      aspect-ratio: 1;
      border-radius: 14px;
      padding: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .post h3 {
      font-family: var(--hf);
      font-size: clamp(24px, 4.4vw, 34px);
      line-height: 1.05;
      margin: 0;
      letter-spacing: -.02em;
    }
    .pill {
      display: inline-block;
      border-radius: 30px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      width: max-content;
    }
    .web {
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .bar {
      display: flex;
      gap: 6px;
      padding: 10px 12px;
      background: #e9e6df;
    }
    .bar i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #c9c5ba;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 20px;
      font-size: 14px;
    }
    .nav span { opacity: .75; }
    .hero {
      display: grid;
      gap: 20px;
      padding: 30px 20px 36px;
      align-items: center;
    }
    @media (min-width: 700px) {
      .hero { grid-template-columns: 1.2fr 1fr; }
    }
    .hero h3 {
      font-family: var(--hf);
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.02;
      margin: 0 0 12px;
      letter-spacing: -.03em;
    }
    .hero p {
      margin: 0 0 18px;
      opacity: .85;
      max-width: 38ch;
    }
    .hero .art {
      aspect-ratio: 1;
      border-radius: 24px;
      max-height: 240px;
    }
    .cta {
      display: inline-block;
      border-radius: var(--r);
      padding: 11px 20px;
      font-weight: 700;
      font-size: 14px;
      margin-right: 8px;
    }
    .voice { display: grid; gap: 12px; }
    .vw {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .vw span {
      border-radius: 18px;
      padding: 6px 14px;
      font-weight: 800;
      font-size: 14px;
    }
    .quote {
      font-size: 19px;
      line-height: 1.35;
      margin: 0;
      font-family: var(--hf);
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .row .ghost {
      flex: 1;
      min-width: 150px;
      text-align: center;
    }
    .saved {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }
    .saved b {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: var(--bg);
      padding: 10px 18px;
      border-radius: 22px;
      font-weight: 800;
      font-size: 14px;
      opacity: 0;
      transition: .2s;
      pointer-events: none;
      z-index: 9;
    }
    #toast.o {
      opacity: 1;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo"><i></i>Markmaker</div>
    <div class="sp"></div>
    <button class="ghost" id="theme" aria-label="Switch light or dark theme">Theme</button>
  </header>

  <div class="wrap">
    <aside id="ctl">
      <h1>Design a brand in minutes.</h1>
      <p class="lead">Tell us about your business and get a logo, colours, fonts and real mockups. Shuffle until it feels like you.</p>

      <div class="card">
        <label for="nm">Brand name</label>
        <input id="nm" maxlength="30" value="Juniper &amp; Co." autocomplete="off">

        <label for="tg">Tagline (optional)</label>
        <input id="tg" maxlength="60" placeholder="What do you do, in a few words?" autocomplete="off">

        <span class="lb">Industry</span>
        <div class="chips" id="ind"></div>

        <span class="lb">Personality</span>
        <div class="chips" id="vibe"></div>

        <button class="btn" id="all">Shuffle everything</button>
        <button class="btn alt" id="save">Save this brand</button>
      </div>

      <div class="card" id="savedbox" style="margin-top:14px" hidden>
        <span class="lb" style="margin-top:0">Saved brands</span>
        <div id="saved"></div>
      </div>
    </aside>

    <main id="board" aria-live="polite"></main>
  </div>

  <div id="toast" role="status"></div>

  <script>
    const $ = s => document.querySelector(s);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

    function rng(str) {
      let h = 1779033703 ^ str.length;
      for (let i = 0; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
        h = h << 13 | h >>> 19;
      }
      let a = h >>> 0;
      return () => {
        a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    const IND = {
      'Food & drink': [8, 48],
      'Tech': [205, 265],
      'Wellness': [105, 170],
      'Fashion': [300, 355],
      'Finance': [190, 230],
      'Creative': [0, 360],
      'Education': [35, 65]
    };

    const SERIF = "Georgia,serif", SANS = "system-ui,sans-serif";

    const VIBE = {
      Modern: {
        s: [55, 78], l: [42, 52], up: 'uppercase', ls: '.06em', r: '10px',
        f: [['Space Grotesk', 'Inter'], ['Sora', 'IBM Plex Sans'], ['Manrope', 'Inter']],
        w: ['Clear', 'Confident', 'Efficient'],
        q: '{n} keeps things simple, so you can get on with what matters.',
        t: ['Simple by design.', 'Built for what’s next.', 'Less noise. More done.']
      },
      Elegant: {
        s: [22, 45], l: [24, 34], up: 'none', ls: '.01em', r: '2px',
        f: [['Playfair Display', 'Lato'], ['Cormorant Garamond', 'Lato']],
        w: ['Refined', 'Assured', 'Timeless'],
        q: 'At {n}, every detail is considered, and nothing is rushed.',
        t: ['Crafted with intention.', 'Quiet luxury, every day.', 'Made to be kept.']
      },
      Playful: {
        s: [78, 95], l: [50, 60], up: 'none', ls: '0', r: '30px',
        f: [['Fredoka', 'Nunito']],
        w: ['Friendly', 'Witty', 'Energetic'],
        q: 'Hi, we’re {n}! We like to keep things fun (and a little bit surprising).',
        t: ['Bring the good vibes.', 'Life’s better with a bounce.', 'Serious fun, every day.']
      },
      Bold: {
        s: [72, 92], l: [38, 48], up: 'uppercase', ls: '.02em', r: '4px',
        f: [['Archivo Black', 'Work Sans']],
        w: ['Direct', 'Loud', 'Fearless'],
        q: '{n} doesn’t whisper. We say it plainly and we mean it.',
        t: ['Own the room.', 'No half measures.', 'Built to stand out.']
      },
      Calm: {
        s: [24, 44], l: [36, 46], up: 'none', ls: '.01em', r: '18px',
        f: [['Fraunces', 'DM Sans']],
        w: ['Gentle', 'Honest', 'Grounded'],
        q: '{n} is here to make things feel a little easier, one step at a time.',
        t: ['Slow down. Start fresh.', 'Good things take root.', 'Made with care.']
      }
    };

    const SH = {
      circle: '<circle cx="32" cy="32" r="30"/>',
      squircle: '<rect x="2" y="2" width="60" height="60" rx="20"/>',
      hexagon: '<polygon points="32,2 58,17 58,47 32,62 6,47 6,17"/>',
      arch: '<path d="M4 62V32a28 28 0 0 1 56 0v30z"/>',
      diamond: '<rect x="9" y="9" width="46" height="46" rx="8" transform="rotate(45 32 32)"/>',
      badge: '<path d="M8 4h48a4 4 0 0 1 4 4v34c0 10-14 16-28 20C18 58 4 52 4 42V8a4 4 0 0 1 4-4z"/>'
    };

    const S = {
      ind: 'Food & drink',
      vibe: 'Calm',
      seed: {
        logo: Math.floor(Math.random() * 999),
        pal: Math.floor(Math.random() * 999),
        font: Math.floor(Math.random() * 999)
      },
      lock: { logo: 0, pal: 0, font: 0 },
      cur: {}
    };

    const key = p => S.ind + '|' + S.vibe + '|' + p + '|' + S.seed[p];

    const hsl = (h, s, l) => {
      h = ((h % 360) + 360) % 360;
      s /= 100;
      l /= 100;
      const k = n => (n + h / 30) % 12,
            a = s * Math.min(l, 1 - l),
            f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
      return '#' + [f(0), f(8), f(4)].map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join('');
    };

    const lum = h => {
      const c = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4);
      return .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
    };

    const on = (bg, P) => {
      const L = lum(bg);
      return (1.05) / (L + .05) > (L + .05) / (lum(P.d) + .05) ? '#ffffff' : P.d;
    };

    const GEN = {
      pal() {
        const r = rng(key('pal')),
              [a, b] = IND[S.ind],
              v = VIBE[S.vibe],
              h = a + r() * (b - a),
              s = v.s[0] + r() * (v.s[1] - v.s[0]),
              l = v.l[0] + r() * (v.l[1] - v.l[0]),
              sw = r() < .5 ? 35 : -35,
              ah = h + (r() < .5 ? 180 : 150) + (r() * 30 - 15);
        return {
          p: hsl(h, s, l),
          s: hsl(h + sw, s * .75, Math.min(l + 18, 72)),
          a: hsl(ah, Math.min(s + 12, 95), 56),
          d: hsl(h, 22, 10),
          l: hsl(h, 40, 96)
        };
      },
      logo() {
        const r = rng(key('logo')),
              k = Object.keys(SH);
        return {
          shape: k[Math.floor(r() * k.length)],
          layout: r() < .5 ? 'inline' : 'stack',
          dot: r() < .5
        };
      },
      font() {
        const r = rng(key('font')),
              f = VIBE[S.vibe].f,
              p = f[Math.floor(r() * f.length)],
              serif = ['Playfair Display', 'Cormorant Garamond', 'Fraunces'].includes(p[0]);
        return {
          h: p[0],
          b: p[1],
          stackH: "'" + p[0] + "'," + (serif ? SERIF : SANS),
          stackB: "'" + p[1] + "'," + SANS
        };
      }
    };

    function regen(part, force) {
      if (S.lock[part] && !force) return;
      S.seed[part]++;
      S.cur[part] = GEN[part]();
    }

    const name = () => $('#nm').value.trim() || 'Your Brand';
    const initial = () => (name().match(/[\p{L}\p{N}]/u) || ['?'])[0].toUpperCase();
    const tag = () => $('#tg').value.trim() || VIBE[S.vibe].t[S.seed.pal % 3];

    function mark(c, bg, fg, sz) {
      const sh = c.logo.shape;
      return `<svg viewBox="0 0 64 64" width="${sz}" height="${sz}" role="img" aria-label="${esc(name())} logo mark"><g fill="${bg}">${SH[sh]}</g><text x="32" y="${sh == 'arch' ? 40 : 33}" text-anchor="middle" dominant-baseline="central" font-family="${esc(c.font.stackH)}" font-size="32" font-weight="700" fill="${fg}">${esc(initial())}</text>${c.logo.dot ? `<circle cx="55" cy="9" r="7" fill="${c.pal.a}"/>` : ''}</svg>`;
    }

    function lock(c, sz, onBg) {
      const P = c.pal,
            bg = onBg || P.p,
            fg = onBg ? P.p : on(P.p, P),
            col = onBg || P.d;
      return `<div class="lk ${c.logo.layout}" style="color:${col};font-size:${sz}px">${mark(c, bg, fg, sz)}<span class="wm">${esc(name())}</span></div>`;
    }

    const vars = c => {
      const v = VIBE[S.vibe];
      return `--hf:${c.font.stackH};--bf:${c.font.stackB};--up:${v.up};--ls:${v.ls};--r:${v.r}`;
    };

    function render() {
      const c = S.cur,
            P = c.pal,
            v = VIBE[S.vibe],
            n = esc(name()),
            lk = (k) => `<button data-lock="${k}" aria-pressed="${!!S.lock[k]}" title="Keep this when shuffling">${S.lock[k] ? '🔒 Locked' : '🔓 Lock'}</button><button data-sh="${k}">Shuffle</button>`;

      const names = [['p', 'Primary'], ['s', 'Secondary'], ['a', 'Accent'], ['d', 'Ink'], ['l', 'Paper']];

      $('#board').innerHTML = `<div class="brand" style="${vars(c)}">
        <section class="card sec">
          <div class="sh"><h2>Logo</h2>${lk('logo')}</div>
          <div class="stage" style="background:${P.l}">${lock(c, 46)}</div>
          <div class="stage" style="background:${P.p};margin-top:10px;padding:22px">${lock(c, 34, on(P.p, P))}</div>
        </section>

        <section class="card sec">
          <div class="sh"><h2>Colours</h2>${lk('pal')}</div>
          <div class="pal">${names.map(([k, l]) => `<button class="sw" data-copy="${P[k]}" style="background:${P[k]};color:${on(P[k], P)}"><b>${l}</b>${P[k].toUpperCase()}<span style="opacity:.8">Tap to copy</span></button>`).join('')}</div>
        </section>

        <section class="card sec">
          <div class="sh"><h2>Typography</h2>${lk('font')}</div>
          <div class="type">
            <div class="aa" style="background:${P.l};color:${P.p}">Aa</div>
            <div>
              <div style="font-family:var(--hf);font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.02em">${n}</div>
              <div style="color:var(--mute);font-size:13px;font-weight:800;margin:6px 0 12px">${esc(c.font.h)} for headings · ${esc(c.font.b)} for text</div>
              <p style="font-family:var(--bf);margin:0;max-width:52ch">${esc(tag())} Good design is a promise kept at every size, on every screen and across every touchpoint.</p>
            </div>
          </div>
        </section>

        <section class="card sec">
          <div class="sh"><h2>In the real world</h2></div>
          <div class="apps">
            <div class="bc" style="background:${P.p};color:${on(P.p, P)}">
              ${lock(c, 34, on(P.p, P))}
              <span style="height:5px;width:46px;border-radius:3px;background:${P.a}"></span>
            </div>

            <div class="bc" style="background:${P.l};color:${P.d};font-family:var(--bf)">
              <div><div class="role">Alex Morgan</div><small>Founder</small></div>
              <small>hello@${esc(name().toLowerCase().replace(/[^a-z0-9]+/g, '') || 'brand')}.com<br>+1 555 010 2030<br>${n}</small>
              <span style="position:absolute;right:0;top:0;bottom:0;width:10px;background:${P.a}"></span>
            </div>

            <div class="post" style="background:${P.d};color:${P.l}">
              <span class="pill" style="background:${P.a};color:${on(P.a, P)};font-family:var(--bf)">New this week</span>
              <h3>${esc(tag())}</h3>
              ${lock(c, 28, P.l)}
            </div>

            <div class="post" style="background:${P.s};color:${on(P.s, P)}">
              <h3>${esc(tag())}</h3>
              <div style="display:flex;justify-content:space-between;align-items:end;gap:10px">
                ${lock(c, 26, on(P.s, P))}
                <span class="pill" style="background:${P.p};color:${on(P.p, P)};font-family:var(--bf)">Learn more</span>
              </div>
            </div>

            <div class="web wide">
              <div class="bar"><i></i><i></i><i></i></div>
              <div style="background:${P.l};color:${P.d};font-family:var(--bf)">
                <div class="nav">
                  ${lock(c, 22)}
                  <span class="sp"></span>
                  <span>About</span>
                  <span>Work</span>
                  <span class="cta" style="margin:0;background:${P.p};color:${on(P.p, P)}">Contact</span>
                </div>
                <div class="hero">
                  <div>
                    <h3>${esc(tag())}</h3>
                    <p>${esc(v.q.replace('{n}', name()))}</p>
                    <span class="cta" style="background:${P.p};color:${on(P.p, P)}">Get started</span>
                    <span class="cta" style="border:2px solid ${P.p};color:${P.p}">See more</span>
                  </div>
                  <div class="art" style="background:linear-gradient(135deg,${P.p},${P.s});display:grid;place-items:center">
                    ${mark(c, P.l, P.p, 96)}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="card sec">
          <div class="sh"><h2>Brand voice</h2></div>
          <div class="voice">
            <div class="vw">${v.w.map(w => `<span style="background:${P.p};color:${on(P.p, P)};font-family:var(--bf)">${w}</span>`).join('')}</div>
            <p class="quote">“${esc(v.q.replace('{n}', name()))}”</p>
          </div>
        </section>

        <section class="card sec">
          <div class="sh"><h2>Take it with you</h2></div>
          <div class="row">
            <button class="ghost" data-x="css">Copy CSS</button>
            <button class="ghost" data-x="svg">Copy logo SVG</button>
            <button class="ghost" data-x="kit">Copy brand summary</button>
          </div>
          <p style="color:var(--mute);font-size:13px;margin:12px 0 0">The logo SVG uses ${esc(c.font.h)}. Install that free Google font wherever you use it.</p>
        </section>
      </div>`;
    }

    const toast = t => {
      const e = $('#toast');
      e.textContent = t;
      e.classList.add('o');
      clearTimeout(toast.t);
      toast.t = setTimeout(() => e.classList.remove('o'), 1800);
    };

    async function copy(t) {
      try {
        await navigator.clipboard.writeText(t);
        toast('Copied');
      } catch (e) {
        const a = document.createElement('textarea');
        a.value = t;
        a.style.cssText = 'position:fixed;opacity:0';
        document.body.append(a);
        a.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (x) {}
        a.remove();
        toast(ok ? 'Copied' : 'Couldn’t copy. Select the text and copy it manually.');
      }
    }

    function exportText(k) {
      const c = S.cur,
            P = c.pal;
      if (k == 'css') return `:root{\n  --brand-primary:${P.p};\n  --brand-secondary:${P.s};\n  --brand-accent:${P.a};\n  --brand-ink:${P.d};\n  --brand-paper:${P.l};\n  --font-heading:${c.font.stackH};\n  --font-body:${c.font.stackB};\n}`;
      if (k == 'svg') return mark(c, P.p, on(P.p, P), 256).replace(' role="img"', '');
      return `${name()}\nTagline: ${tag()}\nIndustry: ${S.ind} · Personality: ${S.vibe}\nColours: Primary ${P.p}, Secondary ${P.s}, Accent ${P.a}, Ink ${P.d}, Paper ${P.l}\nFonts: ${c.font.h} (headings), ${c.font.b} (text)\nVoice: ${VIBE[S.vibe].w.join(', ')}\nLogo: ${c.logo.shape} mark, ${c.logo.layout} layout`;
    }

    function chips(id, items, cur, set) {
      const w = $(id);
      w.replaceChildren(...items.map(x => {
        const b = document.createElement('button');
        b.className = 'chip';
        b.textContent = x;
        b.setAttribute('aria-pressed', x == cur());
        b.onclick = () => {
          set(x);
          w.querySelectorAll('button').forEach(y => y.setAttribute('aria-pressed', y.textContent == cur()));
          ['pal', 'logo', 'font'].forEach(p => regen(p));
          render();
        };
        return b;
      }));
    }

    chips('#ind', Object.keys(IND), () => S.ind, x => S.ind = x);
    chips('#vibe', Object.keys(VIBE), () => S.vibe, x => S.vibe = x);

    $('#nm').oninput = $('#tg').oninput = render;
    $('#all').onclick = () => {
      ['pal', 'logo', 'font'].forEach(p => regen(p, true));
      render();
    };

    $('#board').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.sh) {
        regen(b.dataset.sh, true);
        render();
      } else if (b.dataset.lock) {
        S.lock[b.dataset.lock] ^= 1;
        render();
      } else if (b.dataset.copy) {
        copy(b.dataset.copy.toUpperCase());
      } else if (b.dataset.x) {
        copy(exportText(b.dataset.x));
      }
    });

    const KEY = 'markmaker:saved',
          load = () => {
            try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; }
          },
          store = a => {
            try { localStorage.setItem(KEY, JSON.stringify(a)); } catch (e) { toast('Saving isn’t available in this browser'); }
          };

    function drawSaved() {
      const a = load();
      $('#savedbox').hidden = !a.length;
      $('#saved').replaceChildren(...a.map((s, i) => {
        const d = document.createElement('div');
        d.className = 'saved';
        const n = document.createElement('b');
        n.textContent = s.name;
        const o = document.createElement('button'),
              x = document.createElement('button');
        o.className = x.className = 'ghost';
        o.textContent = 'Open';
        x.textContent = 'Delete';
        x.setAttribute('aria-label', 'Delete ' + s.name);
        o.onclick = () => {
          $('#nm').value = s.name;
          $('#tg').value = s.tag;
          S.ind = s.ind;
          S.vibe = s.vibe;
          S.seed = s.seed;
          S.lock = { logo: 0, pal: 0, font: 0 };
          ['pal', 'logo', 'font'].forEach(p => { S.seed[p]--; regen(p, true); });
          chips('#ind', Object.keys(IND), () => S.ind, y => S.ind = y);
          chips('#vibe', Object.keys(VIBE), () => S.vibe, y => S.vibe = y);
          render();
          toast('Opened ' + s.name);
        };
        x.onclick = () => {
          const l = load();
          l.splice(i, 1);
          store(l);
          drawSaved();
        };
        d.append(n, o, x);
        return d;
      }));
    }

    $('#save').onclick = () => {
      const l = load();
      l.unshift({ name: name(), tag: $('#tg').value.trim(), ind: S.ind, vibe: S.vibe, seed: { ...S.seed } });
      store(l.slice(0, 12));
      drawSaved();
      toast('Saved');
    };

    $('#theme').onclick = () => {
      const r = document.documentElement,
            dk = r.dataset.theme ? r.dataset.theme == 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
      r.dataset.theme = dk ? 'light' : 'dark';
      try { localStorage.setItem('markmaker:theme', r.dataset.theme); } catch (e) {}
    };

    try {
      const t = localStorage.getItem('markmaker:theme');
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}

    ['pal', 'logo', 'font'].forEach(p => regen(p, true));
    render();
    drawSaved();
  </script>
</body>
</html>
