<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1318">
<title>BOUNCY</title>
<style>
:root{--bg:#0f1318;--panel:#171c23;--panel2:#1f262f;--line:#262e38;--text:#f2f5f8;--mute:#8b97a5;--pink:#ff2d87;--pink2:#ff5fa6;--mine:#8f1f52;--ok:#34d399;--bad:#ef4444}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
button{cursor:pointer;font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pink2);outline-offset:2px}
.hidden{display:none!important}
#app{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:0 auto;background:var(--bg)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;background:var(--panel)}
.iconBtn{background:none;border:0;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
.iconBtn:active{background:var(--panel2)}
.tabs{display:flex;gap:28px;font-weight:700;font-size:15px;letter-spacing:.06em}
.tabs button{background:none;border:0;padding:12px 2px;color:var(--mute);border-bottom:3px solid transparent}
.tabs button.on{color:var(--text);border-color:var(--pink)}
#searchBar{display:none;background:var(--panel2);margin:10px 12px;padding:4px 12px;border-radius:12px;align-items:center;gap:8px}
#searchBar.show{display:flex}
#searchBar input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:16px;padding:10px 0}
#searchBar button{background:none;border:0;color:var(--mute);font-size:18px}
.list{flex:1;overflow-y:auto;overscroll-behavior:contain}
.row{display:flex;gap:12px;padding:10px 14px;align-items:center;cursor:pointer}
.row:active,.row:hover{background:var(--panel)}
.avatar{width:50px;height:50px;border-radius:50%;flex-shrink:0;object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;background:linear-gradient(135deg,var(--pink),#7a5af8);position:relative}
.mid{flex:1;min-width:0;border-bottom:1px solid var(--line);padding:2px 0 10px}
.top,.sub{display:flex;justify-content:space-between;gap:8px}
.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-left:6px}
.time{font-size:12px;color:var(--mute);white-space:nowrap}
.last{font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--pink);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.empty{padding:40px 24px;text-align:center;color:var(--mute)}
.fab{position:fixed;right:max(18px,calc(50vw - 432px));bottom:calc(env(safe-area-inset-bottom) + 20px);width:58px;height:58px;border-radius:50%;background:var(--pink);border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(255,45,135,.4);z-index:10}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none}
.overlay.show{display:block}
#drawer{position:fixed;top:0;bottom:0;left:-300px;width:290px;background:var(--panel);transition:left .22s;z-index:60;padding:calc(env(safe-area-inset-top) + 16px) 16px 16px;display:flex;flex-direction:column}
#drawer.open{left:0}
#drawer .me{display:flex;gap:12px;align-items:center;padding:12px 0 20px;border-bottom:1px solid var(--line);margin-bottom:6px}
#drawer .item{background:none;border:0;text-align:left;padding:14px 6px;font-size:16px;border-radius:8px}
#drawer .item:active{background:var(--panel2)}
#chatView{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:30;max-width:900px;margin:0 auto}
#chatView.open{display:flex}
.cHead{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;background:var(--panel)}
.cHead .avatar{width:40px;height:40px;font-size:14px}
.cHead small{color:var(--mute)}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:78%;padding:8px 12px;border-radius:16px 16px 16px 4px;background:var(--panel2);align-self:flex-start;word-break:break-word;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--mine);border-radius:16px 16px 4px 16px}
.msg .t{font-size:11px;color:#c2c9d2;opacity:.7;margin-left:10px;float:right;margin-top:6px}
.msg.pending{opacity:.55}
.inp{display:flex;gap:10px;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:var(--panel);align-items:center}
.inp input{flex:1;background:var(--panel2);border:0;outline:0;color:var(--text);font-size:16px;padding:12px 16px;border-radius:22px}
.send{background:var(--pink);border:0;width:44px;height:44px;border-radius:50%;font-size:18px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
#modal.show{display:flex}
.box{background:var(--panel);padding:20px;border-radius:16px;width:100%;max-width:380px}
.box h3{margin-bottom:6px}
input.f,textarea.f{width:100%;background:var(--panel2);border:0;outline:0;color:var(--text);padding:13px;border-radius:10px;margin:8px 0;font-size:16px;font-family:inherit}
.btn{width:100%;background:var(--pink);border:0;color:#fff;padding:13px;border-radius:10px;font-weight:700;margin-top:6px}
.btn.alt{background:var(--panel2)}
.btn:disabled{opacity:.5}
#peopleResults{max-height:220px;overflow:auto}
.hit{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.hit small{display:block;color:var(--mute)}
#authGate{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.authBox{width:100%;max-width:380px}
.logo{font-size:34px;font-weight:900;letter-spacing:.08em;background:linear-gradient(90deg,var(--pink),#7a5af8);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.authBox p{color:var(--mute);margin-bottom:16px}
#authError{color:#ff8b8b;font-size:14px;min-height:20px;margin-top:10px}
#callLayer{position:fixed;inset:0;background:#0a0d11;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#callLayer.show{display:flex}
.callAvatar{width:104px;height:104px;font-size:36px;margin:20px auto}
#callLayer video{width:100%;max-height:50vh;object-fit:cover;background:#000;border-radius:14px}
#callLayer.video{padding:0;justify-content:flex-end}
#callLayer.video #remoteVideo{position:absolute;inset:0;width:100%;height:100%;max-height:none;border-radius:0}
#callLayer.video #callTitle,#callLayer.video #callStatus{position:absolute;left:0;right:0;z-index:2;text-shadow:0 1px 6px #000}
#callLayer.video #callStatus{color:#fff!important;font-weight:600}
#callLayer.video .callActions button{background:rgba(15,19,24,.65);backdrop-filter:blur(6px)}
#callLayer.video .callActions .end{background:var(--bad)}
#callLayer.video #callTitle{top:calc(env(safe-area-inset-top) + 18px)}
#callLayer.video #callStatus{top:calc(env(safe-area-inset-top) + 52px)}
#callLayer.video .callActions{position:relative;z-index:2;margin-bottom:calc(env(safe-area-inset-bottom) + 30px)}
#callLayer.video #localVideo{top:calc(env(safe-area-inset-top) + 80px)}
#localVideo{width:110px!important;position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 16px)}
.callActions{display:flex;gap:20px;margin-top:30px}
.callActions button{border:0;border-radius:50%;width:62px;height:62px;font-size:22px;background:var(--panel2)}
.callActions .end{background:var(--bad)}.callActions .acc{background:var(--ok)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:#2a323d;padding:10px 16px;border-radius:10px;z-index:200;display:none;max-width:90%;box-shadow:0 4px 16px rgba(0,0,0,.5)}

.voice{display:flex;align-items:center;gap:10px;min-width:210px}
.vplay{width:38px;height:38px;border-radius:50%;border:0;background:var(--pink);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.msg.me .vplay{background:#fff;color:var(--mine)}
.wave{display:flex;align-items:center;gap:2px;height:32px;flex:1}
.wave i{width:3px;border-radius:2px;background:rgba(255,255,255,.3);transition:background .15s;transform-origin:center}
.wave i.on{background:#fff}
.voice.playing .wave i{animation:wv .9s ease-in-out infinite;animation-delay:calc(var(--i)*-70ms)}
@keyframes wv{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.5)}}
.vdur{font-size:12px;opacity:.8;min-width:32px;text-align:right}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:bl 1s infinite;flex-shrink:0}
@keyframes bl{50%{opacity:.2}}
#recBar{align-items:center}#recTime{min-width:38px;font-variant-numeric:tabular-nums}
#recWave{flex:1;display:flex;align-items:center;gap:2px;height:34px;overflow:hidden;justify-content:flex-end}
#recWave i{width:3px;border-radius:2px;background:var(--pink2);flex-shrink:0}
.modal2{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal2.show{display:flex}
#cmtList{max-height:45vh;overflow:auto;margin:10px 0}.cm{padding:8px 0;border-bottom:1px solid var(--line)}.mute{color:var(--mute);font-size:13px}
.stories{display:flex;gap:12px;padding:12px;overflow-x:auto;border-bottom:1px solid var(--line)}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;width:66px;flex-shrink:0;font-size:12px;cursor:pointer}
.st span{width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{padding:3px;border-radius:50%;background:linear-gradient(45deg,var(--pink),#7a5af8)}.ring.add{background:var(--panel2)}
.ring .avatar{width:56px;height:56px;border:3px solid var(--bg)}.ring.add .avatar{background:var(--panel2);font-size:26px}
.post{border-bottom:8px solid var(--panel)}
.ph{display:flex;gap:10px;padding:12px 14px;align-items:center}.ph .avatar{width:40px;height:40px;font-size:14px}
.pb{padding:0 14px 10px;white-space:pre-wrap;word-break:break-word}
.post img,.post video{width:100%;max-height:70vh;object-fit:cover;background:#000;display:block}
.pa{display:flex;gap:20px;padding:10px 14px}.act{background:none;border:0;display:flex;gap:6px;align-items:center}
.lnk{background:none;border:0;color:var(--mute);font-size:13px}
#storyView{position:fixed;inset:0;background:#000;z-index:120;display:none}#storyView.show{display:block}
#stBars{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:10px;right:10px;display:flex;gap:4px;z-index:3}
#stBars i{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden;position:relative}
#stBars i.done{background:#fff}#stBars i.cur::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:fill 5s linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sthead{position:absolute;top:calc(env(safe-area-inset-top) + 20px);left:12px;display:flex;align-items:center;gap:10px;z-index:3;text-shadow:0 1px 4px #000}
.sthead .avatar{width:38px;height:38px;font-size:14px}
.stx{position:absolute;top:calc(env(safe-area-inset-top) + 18px);right:10px;z-index:4;background:none;border:0;font-size:24px;width:44px;height:44px;color:#fff}
.stx.del{right:56px;font-size:20px}
#stMedia{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}#stMedia img,#stMedia video{max-width:100%;max-height:100%;object-fit:contain}
.stzone{position:absolute;top:70px;bottom:0;width:40%;z-index:2}.stzone.l{left:0}.stzone.r{right:0;width:60%}
.item{display:flex;align-items:center;gap:12px}
.sn{font-size:12px;font-weight:700;color:var(--pink2);margin-bottom:2px}
.chip{display:inline-block;background:var(--panel2);border-radius:14px;padding:4px 10px;margin:2px 4px 2px 0;font-size:13px;cursor:pointer}
#stCap{position:absolute;left:0;right:0;bottom:96px;padding:10px 18px;text-align:center;z-index:3;background:linear-gradient(transparent,rgba(0,0,0,.65));display:none}
#stFoot{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:10px;z-index:5;align-items:center}
#stFoot input{flex:1;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);border-radius:22px;color:#fff;padding:12px 16px;font-size:16px;outline:0}
#stFoot input::placeholder{color:#ddd}
#stFoot .btn{margin:0}
.stzone{bottom:90px!important}
#vwModal{z-index:130}
</style>
</head>
<body>

<div id="authGate">
 <form class="authBox" id="authForm" novalidate>
  <div class="logo">BOUNCY</div>
  <p id="authSub">Sign in to message and call people.</p>
  <div id="signupFields" class="hidden">
   <input class="f" id="authDisplay" placeholder="Your name" autocomplete="name" maxlength="40">
   <input class="f" id="authUsername" placeholder="Username (e.g. sisanda)" autocomplete="username" maxlength="24" autocapitalize="none">
  </div>
  <input class="f" id="authEmail" type="email" placeholder="Email address" autocomplete="email">
  <input class="f" id="authPassword" type="password" placeholder="Password (8+ characters)" autocomplete="current-password" minlength="8">
  <button class="btn" id="authSubmit" type="submit">SIGN IN</button>
  <button class="btn alt" id="authSwitch" type="button">CREATE ACCOUNT</button>
  <div id="authError" role="alert"></div>
 </form>
</div>

<div id="callLayer">
 <div id="callTitle" style="font-size:24px;font-weight:700">Calling…</div>
 <div id="callStatus" style="color:var(--mute);margin-top:6px">Connecting</div>
 <div id="callAvatar" class="avatar callAvatar">B</div>
 <video id="remoteVideo" autoplay playsinline></video><audio id="remoteAudio" autoplay></audio>
 <video id="localVideo" autoplay muted playsinline></video>
 <div class="callActions">
  <button id="acceptBtn" class="acc hidden" aria-label="Answer" data-act="accept"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M5 12l5 5 9-10"/></svg></button>
  <button data-act="mute" aria-label="Mute"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></button>
  <button data-act="cam" aria-label="Camera"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
  <button class="end" data-act="end" aria-label="End call"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M6 6l12 12M18 6L6 18"/></svg></button>
 </div>
</div>

<div id="overlay" class="overlay"></div>
<div id="drawer">
 <div class="me" id="drawerMe"></div>
 <button class="item" data-act="newGroup"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5a5 5 0 0 1 4.5 5"/></svg> New group</button>
 <button class="item" data-act="newChannel"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 10v4h4l8 4V6L7 10z"/><path d="M18 9a4 4 0 0 1 0 6"/></svg> New channel</button>
 <button class="item" data-act="findChannels"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg> Find channels</button>
 <button class="item" data-act="settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg> My profile</button>
 <button class="item" data-act="addStory"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg> Add story</button>
 <button class="item" data-act="newPost"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M4 20h4L19 9l-4-4L4 16z"/></svg> New post</button>
 <button class="item" data-act="calls"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg> Calls</button>
 <button class="item" data-act="logout" style="color:#ff7b7b"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg> Log out</button>
 <button class="item" data-act="closeAll" style="color:var(--pink2)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Close</button>
</div>

<div id="app">
 <div class="topbar">
  <button class="iconBtn" data-act="menu" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="tabs"><button id="tabChats" class="on" data-act="chats">CHATS</button><button id="tabFeed" data-act="feed">FEED</button><button id="tabCalls" data-act="calls">CALLS</button></div>
  <button class="iconBtn" data-act="search" aria-label="Search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/></svg></button>
 </div>
 <div id="searchBar"><input id="searchInput" placeholder="Search chats" aria-label="Search chats"><button data-act="closeSearch" aria-label="Close search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
 <div class="list" id="list"></div>
 <div class="list hidden" id="callsList"></div>
 <div class="list hidden" id="feedList"></div>
 <button class="fab" data-act="fab" aria-label="New chat"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>
</div>

<div id="chatView">
 <div class="cHead">
  <button class="iconBtn" data-act="closeChat" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
  <div class="avatar" id="hAv">J</div>
  <div style="flex:1;min-width:0;cursor:pointer" data-act="info"><b id="hName"></b><br><small id="hStatus">last seen recently</small></div>
  <button class="iconBtn" data-act="voice" aria-label="Voice call"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></button>
  <button class="iconBtn" data-act="video" aria-label="Video call"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg></button>
 </div>
 <div class="msgs" id="msgs"></div>
 <div class="inp" id="inpBar"><input id="msgInp" placeholder="Message" maxlength="5000" autocomplete="off" aria-label="Message"><button class="send" id="sendBtn" data-act="recStart" aria-label="Record voice note"></button></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const sb = createClient("https://nruksvjkytpxbiemtalj.supabase.co","sb_publishable_0MgMCUpV93vXHxkthK5AYQ_9IoQgk0-");
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>d?new Date(d).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"";
const errMsg=e=>e?.message||String(e||"Something went wrong");
let me=null,profile=null,chats=[],cur=null,filter="",authMode="signin",onlineIds=new Set();
let call=null,pc=null,localStream=null,callChannel=null,incomingChannel=null,msgChannel=null,presenceChannel=null;
let callTick=null,ringPoll=null,seen=new Set(),pendingIce=[],ringTimer=null,searchTimer=null,toastTimer=null;

function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display="none",3500);}
function avatar(p,cls=""){return p?.avatar_url?`<img class="avatar ${cls}" alt="" src="${esc(p.avatar_url)}">`:`<div class="avatar ${cls}">${esc((p?.display_name||p?.username||"?").slice(0,2).toUpperCase())}</div>`;}

/* ---------- AUTH ---------- */
function setAuthMode(m){authMode=m;const s=m==="signup";$("signupFields").classList.toggle("hidden",!s);$("authSubmit").textContent=s?"CREATE ACCOUNT":"SIGN IN";$("authSwitch").textContent=s?"BACK TO SIGN IN":"CREATE ACCOUNT";$("authPassword").autocomplete=s?"new-password":"current-password";$("authError").textContent="";}
async function authSubmit(e){
 e.preventDefault();
 const email=$("authEmail").value.trim(),password=$("authPassword").value,out=$("authError");out.textContent="";
 if(!email||password.length<8){out.textContent="Enter your email and a password of 8+ characters.";return;}
 $("authSubmit").disabled=true;
 try{
  if(authMode==="signup"){
   const username=$("authUsername").value.trim().replace(/^@/,"").toLowerCase(),display=$("authDisplay").value.trim();
   if(display.length<2||!/^[a-z0-9_]{3,24}$/.test(username))throw new Error("Enter your name and a username (3–24 letters, numbers or _).");
   const {data:taken}=await sb.from("profiles").select("id").eq("username",username).maybeSingle();
   if(taken)throw new Error("That username is taken.");
   const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:display,username},emailRedirectTo:location.href.split("?")[0]}});
   if(error)throw error;
   if(!data.session){out.textContent="Check your email to confirm your account, then sign in.";return;}
  }else{
   const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;
  }
  await enterApp();
 }catch(x){out.textContent=errMsg(x);}finally{$("authSubmit").disabled=false;}
}
async function enterApp(){
 const {data:{user}}=await sb.auth.getUser();me=user;if(!me)return;
 let {data:p,error}=await sb.from("profiles").select("*").eq("id",me.id).maybeSingle();
 if(error)throw error;
 if(!p){
  const md=me.user_metadata||{};
  const r=await sb.from("profiles").upsert({id:me.id,display_name:md.display_name||"New member",username:(md.username||("user_"+me.id.slice(0,8))).toLowerCase()},{onConflict:"id"}).select().single();
  if(r.error)throw r.error;p=r.data;
 }
 profile=p;$("authGate").classList.add("hidden");
 $("drawerMe").innerHTML=avatar(profile)+`<div><b>${esc(profile.display_name)}</b><br><span style="color:var(--mute)">@${esc(profile.username||"")}</span></div>`;
 await loadChats();subscribeMessages();subscribeIncomingCalls();subscribePresence();
}
async function logout(){
 if(!confirm("Log out of BOUNCY?"))return;
 try{
  if(call)await endCall();
  for(const c of [presenceChannel,incomingChannel,msgChannel])if(c)await sb.removeChannel(c);
  presenceChannel=incomingChannel=msgChannel=null;clearInterval(ringPoll);
  await sb.auth.signOut();
  me=profile=cur=null;chats=[];onlineIds.clear();closeAll();closeChat();
  $("list").innerHTML="";$("callsList").innerHTML="";$("authPassword").value="";$("authGate").classList.remove("hidden");
 }catch(e){toast("Could not log out: "+errMsg(e));}
}

/* ---------- CHATS ---------- */
async function loadChats(){
 const {data,error}=await sb.rpc("get_my_chats");
 if(error){toast(errMsg(error));return;}
 chats=(data||[]).map(r=>({id:r.conversation_id,kind:r.kind,role:r.my_role,members:Number(r.member_count||0),other_id:r.other_id,person:{display_name:r.display_name,username:r.username,avatar_url:r.avatar_url},name:r.display_name||r.username||"BOUNCY member",last:r.last_body||"No messages yet",at:r.last_at,unread:0,msgs:[]}));
 render();
}
function render(){
 const f=filter.toLowerCase();
 const found=chats.filter(c=>(c.name+" "+(c.person.username||"")).toLowerCase().includes(f));
 $("list").innerHTML=found.map(c=>`<div class="row" data-chat="${esc(c.id)}" role="button" tabindex="0">${chatAvatar(c)}<div class="mid"><div class="top"><span class="name">${esc(c.name)}${onlineIds.has(c.other_id)?'<span class="dot" title="online"></span>':""}</span><span class="time">${fmt(c.at)}</span></div><div class="sub"><span class="last">${esc(c.last)}</span>${c.unread?`<span class="badge">${c.unread}</span>`:""}</div></div></div>`).join("")||`<div class="empty">${f?"No matching chats.":"No conversations yet.<br>Tap the pencil to find someone by username."}</div>`;
}
async function openChat(id){
 cur=chats.find(c=>c.id===id);if(!cur)return;cur.unread=0;
 $("hName").textContent=cur.name;$("hAv").outerHTML=chatAvatar(cur).replace('class="avatar','id="hAv" class="avatar');
 $("chatView").classList.add("open");applyChatMode();updatePresence();render();
 const {data,error}=await sb.from("messages").select("id,body,sender_id,created_at,kind,audio_url,audio_ms,peaks,profiles(display_name)").eq("conversation_id",cur.id).order("created_at",{ascending:false}).limit(100);
 if(error){toast(errMsg(error));return;}
 for(const m of data||[])if(m.profiles?.display_name)names.set(m.sender_id,m.profiles.display_name);cur.msgs=(data||[]).reverse();renderMsgs();$("msgInp").focus();
}
function renderMsgs(){
 const box=$("msgs");
 box.innerHTML=(cur?.msgs||[]).map(m=>`<div class="msg${m.sender_id===me.id?" me":""}${m.pending?" pending":""}">${senderTag(m)}${m.kind==="voice"?voiceHTML(m):esc(m.body)}<span class="t">${fmt(m.created_at)}</span></div>`).join("");
 box.scrollTop=box.scrollHeight;updateSendBtn();applyPlaying();if(vid&&va.ontimeupdate)va.ontimeupdate();
}
function closeChat(){stopVoice();if(rec)recFinish(false);cur=null;$("chatView").classList.remove("open");render();}
function subscribeMessages(){
 if(msgChannel)sb.removeChannel(msgChannel);
 msgChannel=sb.channel("my-messages").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},async p=>{
  const m=p.new;let c=chats.find(x=>x.id===m.conversation_id);
  if(!c){await loadChats();c=chats.find(x=>x.id===m.conversation_id);if(!c)return;}
  c.last=m.body;c.at=m.created_at;
  if(cur&&cur.id===c.id){if(!cur.msgs.some(x=>x.id===m.id)){cur.msgs=cur.msgs.filter(x=>!(x.pending&&x.body===m.body&&x.sender_id===m.sender_id));cur.msgs.push(m);renderMsgs();}}
  else if(m.sender_id!==me.id)c.unread++;
  chats.sort((a,b)=>new Date(b.at||0)-new Date(a.at||0));render();
 }).subscribe();
}
async function sendMsg(){
 const input=$("msgInp"),body=input.value.trim();if(!body||!cur)return;input.value="";updateSendBtn();
 const tmp={id:"tmp"+Date.now(),body,sender_id:me.id,created_at:new Date().toISOString(),pending:true};
 cur.msgs.push(tmp);renderMsgs();
 const {data,error}=await sb.from("messages").insert({conversation_id:cur.id,sender_id:me.id,body}).select().single();
 cur.msgs=cur.msgs.filter(m=>m!==tmp);
 if(error){toast("Message not sent: "+errMsg(error));input.value=body;renderMsgs();return;}
 if(!cur.msgs.some(m=>m.id===data.id))cur.msgs.push(data);
 cur.last=body;cur.at=data.created_at;renderMsgs();render();
}

/* ---------- NEW CHAT ---------- */
let picked=null;
function openNewChat(){picked=null;$("modal").classList.add("show");$("newName").value="";$("newMsg").value="";$("peopleResults").innerHTML='<p style="color:var(--mute);font-size:13px">Type at least 2 characters of a username.</p>';$("newName").focus();}
function searchPeople(){
 picked=null;const term=$("newName").value.trim().replace(/^@/,"").toLowerCase().replace(/[^a-z0-9_]/g,"");clearTimeout(searchTimer);
 if(term.length<2){$("peopleResults").innerHTML='<p style="color:var(--mute);font-size:13px">Type at least 2 characters of a username.</p>';return;}
 searchTimer=setTimeout(async()=>{
  const {data,error}=await sb.from("profiles").select("id,display_name,username,avatar_url").neq("id",me.id).ilike("username",term+"%").order("username").limit(20);
  if(error){$("peopleResults").innerHTML=`<p style="color:#ff8b8b">${esc(errMsg(error))}</p>`;return;}
  $("peopleResults").innerHTML=(data||[]).map(p=>`<div class="hit" data-pick="${esc(p.id)}" data-un="${esc(p.username)}">${avatar(p)}<div><b>${esc(p.display_name||p.username)}</b><small>@${esc(p.username)}</small></div></div>`).join("")||'<p style="color:var(--mute);font-size:13px">No members found.</p>';
 },250);
}
async function createChat(){
 const btn=$("startBtn"),first=$("newMsg").value.trim();
 if(!picked){toast("Tap a person from the results first.");return;}
 btn.disabled=true;
 try{
  const {data:id,error}=await sb.rpc("get_or_create_dm",{other:picked});if(error)throw error;
  if(first){const {error:e2}=await sb.from("messages").insert({conversation_id:id,sender_id:me.id,body:first});if(e2)throw e2;}
  closeAll();await loadChats();await openChat(id);
 }catch(e){toast(errMsg(e));}finally{btn.disabled=false;}
}

/* ---------- PRESENCE & UI ---------- */
function subscribePresence(){
 if(presenceChannel)sb.removeChannel(presenceChannel);
 presenceChannel=sb.channel("bouncy-online",{config:{presence:{key:me.id}}});
 presenceChannel.on("presence",{event:"sync"},()=>{onlineIds=new Set(Object.keys(presenceChannel.presenceState()));render();updatePresence();})
  .subscribe(s=>{if(s==="SUBSCRIBED")presenceChannel.track({at:Date.now()});});
}
function updatePresence(){if(cur)$("hStatus").textContent=cur.kind==="dm"?(onlineIds.has(cur.other_id)?"online":"last seen recently"):cur.members+(cur.kind==="channel"?" subscribers":" members");}
function closeAll(){document.querySelectorAll(".modal2.show").forEach(m=>m.classList.remove("show"));$("drawer").classList.remove("open");$("overlay").classList.remove("show");$("modal").classList.remove("show");}
function showChats(){$("feedList").classList.add("hidden");$("tabFeed").classList.remove("on");tab="chats";$("tabChats").classList.add("on");$("tabCalls").classList.remove("on");$("list").classList.remove("hidden");$("callsList").classList.add("hidden");}
async function showCalls(){
 closeAll();$("feedList").classList.add("hidden");$("tabFeed").classList.remove("on");tab="calls";$("tabChats").classList.remove("on");$("tabCalls").classList.add("on");$("list").classList.add("hidden");
 const cl=$("callsList");cl.classList.remove("hidden");
 const {data,error}=await sb.from("call_sessions").select("id,caller_id,call_type,status,created_at").order("created_at",{ascending:false}).limit(40);
 if(error){cl.innerHTML=`<div class="empty">${esc(errMsg(error))}</div>`;return;}
 cl.innerHTML=(data||[]).map(c=>{const out=c.caller_id===me.id;return `<div class="row"><div class="avatar">${c.call_type==="video"?IC.video:IC.phone}</div><div class="mid"><div class="top"><span class="name">${out?"Outgoing":"Incoming"} ${esc(c.call_type)}</span><span class="time">${new Date(c.created_at).toLocaleDateString()}</span></div><div class="sub"><span class="last">${esc(c.status)}</span></div></div></div>`;}).join("")||'<div class="empty">No calls yet.</div>';
}

/* ---------- CALLS ---------- */
async function onRinging(row){
 if(!row||row.status!=="ringing"||row.callee_id!==me.id)return;
 if(Date.now()-new Date(row.created_at).getTime()>45000)return;
 if(call){if(call.id!==row.id)await sb.from("call_sessions").update({status:"rejected"}).eq("id",row.id);return;}
 const {data:pr}=await sb.from("profiles").select("display_name").eq("id",row.caller_id).maybeSingle();
 if(call)return;
 call={id:row.id,caller_id:row.caller_id,callee_id:me.id,type:row.call_type,incoming:true,otherName:pr?.display_name||"Incoming caller"};
 showCallUI(true);watchCallStatus();
}
async function checkRinging(){
 if(!me||call)return;
 const since=new Date(Date.now()-40000).toISOString();
 const {data}=await sb.from("call_sessions").select("*").eq("callee_id",me.id).eq("status","ringing").gt("created_at",since).order("created_at",{ascending:false}).limit(1);
 if(data&&data[0])await onRinging(data[0]);
}
function subscribeIncomingCalls(){
 if(incomingChannel)sb.removeChannel(incomingChannel);
 incomingChannel=sb.channel("incoming-"+me.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"call_sessions",filter:"callee_id=eq."+me.id},p=>onRinging(p.new)).subscribe();
 clearInterval(ringPoll);ringPoll=setInterval(checkRinging,3000);
}
function showCallUI(incoming){
 const v=call.type==="video";$("callLayer").classList.add("show");$("callLayer").classList.toggle("video",v);$("callAvatar").textContent=(call.otherName||"B").slice(0,2).toUpperCase();$("callTitle").textContent=call.otherName||"BOUNCY call";
 $("callStatus").textContent=incoming?`Incoming ${call.type} call`:"Calling…";
 $("callAvatar").classList.toggle("hidden",v);$("remoteVideo").classList.toggle("hidden",!v);$("localVideo").classList.toggle("hidden",!v);
 $("acceptBtn").classList.toggle("hidden",!incoming);
 clearTimeout(ringTimer);if(!incoming)ringTimer=setTimeout(()=>{if(call&&$("callStatus").textContent==="Calling…"){toast("No answer.");sb.from("call_sessions").update({status:"missed"}).eq("id",call.id).then(()=>{});endCall();}},45000);
}
function watchCallStatus(){
 if(callChannel)sb.removeChannel(callChannel);const id=call.id;
 callChannel=sb.channel("call-status-"+id).on("postgres_changes",{event:"UPDATE",schema:"public",table:"call_sessions",filter:"id=eq."+id},p=>{
  if(!call||call.id!==id)return;
  if(["ended","rejected","missed"].includes(p.new.status)){if(p.new.status==="rejected")toast("Call declined.");cleanupCall();}
 }).subscribe();
}
async function startCall(type){
 if(!cur){toast("Open a conversation first.");return;}
 if(call)return;
 call={caller_id:me.id,callee_id:cur.other_id,type,incoming:false,otherName:cur.name};
 try{
  const {data,error}=await sb.from("call_sessions").insert({caller_id:me.id,callee_id:cur.other_id,call_type:type}).select().single();
  if(error)throw error;call.id=data.id;showCallUI(false);
  await preparePeer();await subscribeCallSignals();watchCallStatus();
  const offer=await pc.createOffer();await pc.setLocalDescription(offer);await sendSignal({type:"offer",sdp:offer});
 }catch(e){toast("Could not start call: "+errMsg(e));await endCall();}
}
async function preparePeer(){
 localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:call.type==="video"});
 $("localVideo").srcObject=localStream;
 pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]});
 localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
 pc.ontrack=e=>{(call.type==="video"?$("remoteVideo"):$("remoteAudio")).srcObject=e.streams[0];if(!callTick){clearTimeout(ringTimer);const t0=Date.now();callTick=setInterval(()=>{const d=Math.floor((Date.now()-t0)/1000);$("callStatus").textContent=String(Math.floor(d/60)).padStart(2,"0")+":"+String(d%60).padStart(2,"0");},1000);$("callStatus").textContent="00:00";}};
 pc.onicecandidate=e=>{if(e.candidate)sendSignal({type:"ice",candidate:e.candidate.toJSON()}).catch(()=>{});};
 pc.onconnectionstatechange=()=>{if(pc&&pc.connectionState==="failed"){toast("Connection lost.");endCall();}};
}
async function subscribeCallSignals(){
 const id=call.id;
 const ch=sb.channel("call-signals-"+id).on("postgres_changes",{event:"INSERT",schema:"public",table:"call_signals",filter:"call_id=eq."+id},p=>handleSignal(p.new)).subscribe();
 callSignalChannel=ch;
 const {data}=await sb.from("call_signals").select("*").eq("call_id",id).order("id");
 for(const s of data||[])await handleSignal(s);
}
let callSignalChannel=null;
async function sendSignal(signal){
 if(!call)return;const to=me.id===call.caller_id?call.callee_id:call.caller_id;
 const {error}=await sb.from("call_signals").insert({call_id:call.id,sender_id:me.id,recipient_id:to,signal});if(error)throw error;
}
async function handleSignal(row){
 if(!call||!pc||row.recipient_id!==me.id||seen.has(row.id))return;seen.add(row.id);const s=row.signal;
 const flush=async()=>{for(const c of pendingIce.splice(0))await pc.addIceCandidate(new RTCIceCandidate(c));};
 try{
  if(s.type==="offer"&&call.incoming){await pc.setRemoteDescription(new RTCSessionDescription(s.sdp));await flush();const a=await pc.createAnswer();await pc.setLocalDescription(a);await sendSignal({type:"answer",sdp:a});}
  else if(s.type==="answer"&&!call.incoming){await pc.setRemoteDescription(new RTCSessionDescription(s.sdp));await flush();}
  else if(s.type==="ice"&&s.candidate){if(pc.remoteDescription)await pc.addIceCandidate(new RTCIceCandidate(s.candidate));else pendingIce.push(s.candidate);}

/* recording */
const pickMime=()=>["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||"";
function drawRec(pk){$("recWave").innerHTML=pk.slice(-60).map(h=>`<i style="height:${Math.max(8,h)}%"></i>`).join("");}
async function recStart(){
 if(!cur||rec)return;if(call){toast("Finish your call first.");return;}
 if(!window.MediaRecorder){toast("Voice notes are not supported in this browser.");return;}
 try{
  stopVoice();
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mime=pickMime(),mr=new MediaRecorder(stream,mime?{mimeType:mime}:{});
  const ac=new (window.AudioContext||window.webkitAudioContext)(),an=ac.createAnalyser();an.fftSize=256;ac.createMediaStreamSource(stream).connect(an);
  const buf=new Uint8Array(an.fftSize),chunks=[],peaks=[],t0=Date.now();
  const tick=setInterval(()=>{an.getByteTimeDomainData(buf);let m=0;for(const v of buf)m=Math.max(m,Math.abs(v-128));peaks.push(Math.min(100,Math.round(m/128*150)));drawRec(peaks);$("recTime").textContent=dur(Date.now()-t0);if(Date.now()-t0>=299000)recFinish(true);},100);
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  rec={mr,stream,ac,chunks,peaks,tick,t0,mime:mr.mimeType||mime,conv:cur.id};
  mr.start();$("inpBar").classList.add("hidden");$("recBar").classList.remove("hidden");$("recTime").textContent="0:00";$("recWave").innerHTML="";
 }catch(e){toast("Allow microphone access to record voice notes.");}
}
function bars(pk,n=40){if(!pk.length)return Array(n).fill(15);const o=[];for(let i=0;i<n;i++){const a=Math.floor(i*pk.length/n),b=Math.max(a+1,Math.floor((i+1)*pk.length/n));o.push(Math.max(10,Math.max(...pk.slice(a,b))));}return o;}
async function recFinish(send){
 if(!rec)return;const r=rec;rec=null;clearInterval(r.tick);const ms=Date.now()-r.t0;
 await new Promise(res=>{r.mr.onstop=res;if(r.mr.state!=="inactive")r.mr.stop();else res();});
 r.stream.getTracks().forEach(t=>t.stop());r.ac.close().catch(()=>{});
 $("recBar").classList.add("hidden");$("inpBar").classList.remove("hidden");
 if(!send)return;if(ms<700){toast("Hold on a little longer to record.");return;}
 try{
  const type=r.mime||"audio/webm",blob=new Blob(r.chunks,{type}),ext=type.includes("mp4")?"m4a":type.includes("ogg")?"ogg":"webm";
  const path=`${me.id}/${crypto.randomUUID()}.${ext}`;
  const {error:ue}=await sb.storage.from("voice").upload(path,blob,{contentType:type});if(ue)throw ue;
  const url=sb.storage.from("voice").getPublicUrl(path).data.publicUrl;
  const {data,error}=await sb.from("messages").insert({conversation_id:r.conv,sender_id:me.id,body:"Voice message",kind:"voice",audio_url:url,audio_ms:Math.min(ms,300000),peaks:bars(r.peaks)}).select().single();
  if(error)throw error;
  if(cur&&cur.id===r.conv&&!cur.msgs.some(m=>m.id===data.id)){cur.msgs.push(data);renderMsgs();}
  const c=chats.find(x=>x.id===r.conv);if(c){c.last="Voice message";c.at=data.created_at;render();}
 }catch(e){toast("Voice note not sent: "+errMsg(e));}
}

 grpTimer=setTimeout(async()=>{
  const {data}=await sb.from("profiles").select("id,display_name,username,avatar_url").neq("id",me.id).ilike("username",term+"%").order("username").limit(10);
  $("grpResults").innerHTML=(data||[]).map(p=>`<div class="hit" data-act="grpPick" data-id="${esc(p.id)}" data-dn="${esc(p.display_name||"")}" data-un="${esc(p.username)}">${avatar(p)}<div><b>${esc(p.display_name||p.username)}</b><small>@${esc(p.username)}</small></div></div>`).join("")||'<p class="mute">No members found.</p>';
 },250);
});
async function createGroup(){
 const title=$("grpTitle").value.trim();
 if(title.length<2){toast("Give it a name (2+ characters).");return;}
 if(grpKind==="group"&&!grpMembers.size){toast("Add at least one member.");return;}
 const b=$("grpBtn");b.disabled=true;
 try{
  const {data:id,error}=await sb.rpc("create_group",{p_title:title,p_members:[...grpMembers.keys()],p_kind:grpKind,p_description:$("grpDesc").value.trim()});
  if(error)throw error;closeAll();await loadChats();await openChat(id);
 }finally{b.disabled=false;}
}
async function searchChannels(){
 const {data,error}=await sb.rpc("search_channels",{q:$("chQ").value.trim()});if(error){toast(errMsg(error));return;}
 $("chRes").innerHTML=(data||[]).map(c=>`<div class="hit"><div class="avatar">${IC.channel}</div><div style="flex:1;min-width:0"><b>${esc(c.title)}</b><small>${esc(c.description||"")} ${c.member_count} subscribers</small></div>${c.joined?`<button class="lnk" data-act="openCh" data-id="${esc(c.id)}">Open</button>`:`<button class="btn" style="width:auto;padding:8px 14px;margin:0" data-act="joinCh" data-id="${esc(c.id)}">Join</button>`}</div>`).join("")||'<p class="mute">No channels found.</p>';
}
async function findChannels(){closeAll();$("chQ").value="";$("chModal").classList.add("show");await searchChannels();$("chQ").focus();}
$("chQ").addEventListener("input",()=>{clearTimeout(chTimer);chTimer=setTimeout(searchChannels,250);});
async function joinCh(a){const id=a.dataset.id;const {error}=await sb.rpc("join_channel",{p_conv:id});if(error)throw error;closeAll();await loadChats();await openChat(id);}
async function info(){
 if(!cur||cur.kind==="dm")return;
 $("infoTitle").textContent=cur.name;$("infoSub").textContent=cur.members+(cur.kind==="channel"?" subscribers":" members");
 $("infoAdd").classList.toggle("hidden",!(cur.kind==="group"&&["owner","admin"].includes(cur.role)));
 $("infoList").innerHTML='<p class="mute">Loading…</p>';$("infoModal").classList.add("show");
 const {data}=await sb.from("conversation_members").select("user_id,role,profiles(display_name,username,avatar_url)").eq("conversation_id",cur.id).limit(200);
 $("infoList").innerHTML=(data||[]).map(m=>`<div class="hit">${avatar(m.profiles)}<div><b>${esc(m.profiles?.display_name||m.profiles?.username||"Member")}</b><small>@${esc(m.profiles?.username||"")}${m.role!=="member"?" · "+esc(m.role):""}</small></div></div>`).join("");
}
async function addMember(){
 const u=$("infoUser").value.trim();if(!u||!cur)return;
 const {error}=await sb.rpc("add_member_by_username",{p_conv:cur.id,p_username:u});if(error)throw error;
 $("infoUser").value="";cur.members++;updatePresence();toast("Member added.");await info();
}
async function leaveChat(){
 if(!cur||!confirm("Leave "+cur.name+"?"))return;const id=cur.id;
 const {error}=await sb.from("conversation_members").delete().eq("conversation_id",id).eq("user_id",me.id);if(error)throw error;
 closeAll();closeChat();await loadChats();
}

/* stories: captions, views, replies */
async function addStory(){
 closeAll();const f=await pickFile("image/*,video/*");if(!f)return;
 if(f.size>50*1048576){toast("File too big (50 MB max).");return;}
 storyFile=f;$("stFileName").textContent=f.name;$("stCapInput").value="";$("stModal").classList.add("show");$("stCapInput").focus();
}
async function submitStory(){
 if(!storyFile)return;const b=$("stBtn");b.disabled=true;
 try{
  toast("Uploading story…");const url=await upload("posts",storyFile);
  const {error}=await sb.from("stories").insert({author_id:me.id,media_url:url,media_type:storyFile.type.startsWith("video")?"video":"image",caption:$("stCapInput").value.trim()});
  if(error)throw error;storyFile=null;closeAll();await loadStories();if(tab==="feed")renderFeed();toast("Story posted.");
 }finally{b.disabled=false;}
}
function afterShow(s,g){
 $("stCap").textContent=s.caption||"";$("stCap").style.display=s.caption?"block":"none";
 const foot=$("stFoot");
 if(g.author.id===me.id){
  foot.innerHTML='<button class="btn alt" id="vwBtn" data-act="stViews" style="display:flex;align-items:center;justify-content:center;gap:8px">'+IC.eye+' <span>…</span></button>';
  sb.from("story_views").select("viewer_id",{count:"exact",head:true}).eq("story_id",s.id).then(({count})=>{const b=$("vwBtn");if(b&&sv&&sv.g.items[sv.i].id===s.id)b.querySelector("span").textContent=(count||0)+((count||0)===1?" view":" views");});
 }else{
  foot.innerHTML=`<input id="stReply" maxlength="500" placeholder="Reply to ${esc(g.author.display_name||g.author.username)}…" autocomplete="off"><button class="send" data-act="stSend" aria-label="Send reply">${SVG.send}</button>`;
  sb.from("story_views").upsert({story_id:s.id,viewer_id:me.id},{onConflict:"story_id,viewer_id",ignoreDuplicates:true}).then(()=>{});
 }
}
async function stSend(){
 const t=$("stReply")?.value.trim();if(!t||!sv)return;
 const {data:id,error}=await sb.rpc("get_or_create_dm",{other:sv.g.author.id});if(error)throw error;
 const {error:e2}=await sb.from("messages").insert({conversation_id:id,sender_id:me.id,body:("Story reply: "+t).slice(0,5000)});if(e2)throw e2;
 $("stReply").value="";$("stReply").blur();toast("Reply sent.");
}
async function stViews(){
 if(!sv)return;const s=sv.g.items[sv.i];clearTimeout(svTimer);
 $("vwList").innerHTML='<p class="mute">Loading…</p>';$("vwModal").classList.add("show");
 const {data,error}=await sb.from("story_views").select("viewed_at,profiles!story_views_viewer_id_fkey(display_name,username,avatar_url)").eq("story_id",s.id).order("viewed_at",{ascending:false}).limit(200);
 if(error){toast(errMsg(error));return;}
 $("vwList").innerHTML=(data||[]).map(v=>`<div class="hit">${avatar(v.profiles)}<div><b>${esc(v.profiles?.display_name||v.profiles?.username||"Member")}</b><small>${ago(v.viewed_at)} ago</small></div></div>`).join("")||'<p class="mute">No views yet.</p>';
}
document.addEventListener("focusin",e=>{if(e.target.id==="stReply"&&sv){clearTimeout(svTimer);$("stMedia").querySelector("video")?.pause();document.querySelectorAll("#stBars i.cur").forEach(i=>i.style.animationPlayState="paused");}});
document.addEventListener("focusout",e=>{if(e.target.id==="stReply"&&sv){const s=sv.g.items[sv.i];if(s.media_type==="image")svTimer=setTimeout(nextStory,5000);else $("stMedia").querySelector("video")?.play();document.querySelectorAll("#stBars i.cur").forEach(i=>i.style.animationPlayState="running");}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="stReply")stSend().catch(x=>toast(errMsg(x)));});

/* ---------- EVENTS ---------- */
const actions={
 menu:()=>{$("drawer").classList.add("open");$("overlay").classList.add("show");},
 closeAll,chats:showChats,calls:showCalls,logout,newChat:openNewChat,createChat,closeChat,send:sendMsg,
 search:()=>{$("searchBar").classList.add("show");$("searchInput").focus();},
 closeSearch:()=>{$("searchBar").classList.remove("show");filter="";$("searchInput").value="";render();},
 voice:()=>startCall("voice"),video:()=>startCall("video"),accept:acceptCall,end:endCall,mute:()=>toggle("a"),cam:()=>toggle("v"),
 newGroup:()=>openGroup("group"),newChannel:()=>openGroup("channel"),createGroup,grpPick:a=>{grpMembers.set(a.dataset.id,{id:a.dataset.id,display_name:a.dataset.dn,username:a.dataset.un});renderChips();$("grpSearch").value="";$("grpResults").innerHTML="";},rmChip:a=>{grpMembers.delete(a.dataset.id);renderChips();},
 findChannels,joinCh,openCh:a=>{closeAll();openChat(a.dataset.id);},info,addMember,leaveChat,submitStory,stSend,stViews,
 feed:showFeed,fab:()=>tab==="feed"?newPost():openNewChat(),newPost,submitPost,pickPostFile,addStory,settings,saveSettings,changePhoto,sendCmt,
 recStart,recCancel:()=>recFinish(false),recSend:()=>recFinish(true),
 vplay:a=>vplay(a.dataset.id),like:a=>like(a.dataset.id),cmt:a=>cmt(a.dataset.id),delPost:a=>delPost(a.dataset.id),
 openStory:a=>openStory(+a.dataset.i),stClose:closeStory,stNext:nextStory,stPrev:prevStory,stDel
};
document.addEventListener("click",e=>{
 const a=e.target.closest("[data-act]");if(a){Promise.resolve(actions[a.dataset.act]?.(a)).catch(x=>toast(errMsg(x)));return;}
 const r=e.target.closest("[data-chat]");if(r){openChat(r.dataset.chat);return;}
 const h=e.target.closest("[data-pick]");if(h){picked=h.dataset.pick;$("newName").value=h.dataset.un;$("peopleResults").innerHTML=`<p style="color:var(--pink2);padding:6px 0">Selected @${esc(h.dataset.un)}</p>`;}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset?.chat!==undefined)openChat(e.target.dataset.chat);if(e.key==="Escape")closeAll();});
$("overlay").onclick=closeAll;
$("authForm").addEventListener("submit",authSubmit);
$("authSwitch").onclick=()=>setAuthMode(authMode==="signin"?"signup":"signin");
$("searchInput").addEventListener("input",e=>{filter=e.target.value;render();});
$("newName").addEventListener("input",searchPeople);
$("msgInp").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg();}});
history.scrollRestoration="manual";
document.addEventListener("visibilitychange",()=>{if(!document.hidden){checkRinging();if(me)loadChats();if(me&&!msgChannel)subscribeMessages();}});
window.addEventListener("online",()=>{if(me){subscribeMessages();subscribeIncomingCalls();loadChats();}});

const {data:{session}}=await sb.auth.getSession();
if(session){try{await enterApp();}catch(e){$("authError").textContent=errMsg(e);}}
</script>
</body>
</html>
