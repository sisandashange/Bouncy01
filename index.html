<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Bouncy</title>
<style>
*{box-sizing:border-box}
:root{--ink:#FFFFFF;--card:#F3F2F8;--line:#E2E0EC;--violet:#6C4DF0;--sun:#FFC83D;--text:#111111;--muted:#6B6880;--danger:#D6293E}
:root[data-theme=dark]{--ink:#150F2E;--card:#231A45;--line:#33285C;--violet:#7B5CFF;--text:#F4F1FF;--muted:#9C93C4;--danger:#FF6B7A}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100dvh;max-width:640px;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
input,textarea,button{font:inherit;color:inherit}
input,textarea{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;font-size:16px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--violet)}
.auth{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:28px}
.logo{font-size:56px;font-weight:900;letter-spacing:-2px;margin:0}
.tag{color:var(--violet);font-size:18px;font-weight:600;margin:0 0 18px}
.err{color:var(--danger);font-size:14px}
.btn{background:var(--sun);color:#111;border:0;border-radius:16px;padding:17px;font-size:17px;font-weight:800}
.link{color:var(--muted);text-align:center;cursor:pointer;font-size:15px}
.head{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 0}
.head h1{font-size:34px;font-weight:900;letter-spacing:-1.5px;margin:0}
.search{margin:16px;width:calc(100% - 32px);padding:14px;border:0}
.rows{flex:1;overflow-y:auto}
.row{display:flex;align-items:center;gap:14px;padding:12px 20px;cursor:pointer}
.row:active{background:var(--card)}
.av{color:#fff;width:50px;height:50px;border-radius:50%;background:var(--violet);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex:none}
.rt{min-width:0}.rt b{display:block;font-size:17px}
.rt span{display:block;color:var(--muted);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);text-align:center;margin:60px 40px;line-height:1.5}
.chead{justify-content:flex-start;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.back{color:var(--violet);font-size:38px;line-height:30px;cursor:pointer;padding:0 6px}
.chead h2{margin:0;font-size:20px;font-weight:800}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:80%;padding:9px 14px;border-radius:20px;overflow-wrap:anywhere}
.mine{color:#fff;align-self:flex-end;background:var(--violet);border-bottom-right-radius:6px}
.theirs{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px}
.bd{font-size:16px;line-height:1.3;white-space:pre-wrap}
.tm{font-size:11px;color:var(--muted);text-align:right;margin-top:3px}
.mine .tm{color:#D9CFFF}
.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.8);opacity:.4}to{transform:scale(1);opacity:1}}
.bar{display:flex;gap:10px;align-items:flex-end;padding:12px}
.bar textarea{flex:1;border-radius:22px;padding:11px 16px;resize:none;max-height:120px}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--sun);color:#111;font-size:24px;font-weight:900;flex:none;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.send:active{transform:scale(.82)}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--ink)}
.tabs a{flex:1;text-align:center;padding:12px 0 10px;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}
.tabs a b{display:block;font-size:22px;line-height:24px}
.tabs a.on{color:var(--violet)}
.comp{margin:12px 16px;background:var(--card);border-radius:18px;padding:10px}
.comp textarea{border:0;background:transparent;padding:6px;resize:none}
.crow{display:flex;align-items:center;gap:10px;padding:0 4px}
.crow .muted{flex:1;color:var(--muted);font-size:13px;overflow:hidden;white-space:nowrap}
.ph{font-size:22px;cursor:pointer}
.btn.sm{padding:9px 20px;font-size:15px}
.btn:disabled{opacity:.5}
.post{margin:0 16px 14px;background:var(--card);border-radius:20px;padding:14px}
.who{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.who .av{width:38px;height:38px;font-size:16px}
.who span{display:block;color:var(--muted);font-size:12px}
.post p{margin:6px 0 8px;font-size:16px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.post img{width:100%;border-radius:14px;display:block;margin-bottom:8px;background:var(--line)}
.like{background:none;border:0;color:var(--muted);font-size:16px;font-weight:700;padding:4px 2px}
.like.on{color:#FF5C8A}
.like.pp{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.me{padding:20px;display:flex;flex-direction:column;gap:14px}
.me small{color:var(--muted)}
.cm{background:none;border:0;color:var(--muted);font-size:16px;font-weight:700;padding:4px 10px}
.cmt{font-size:14px;margin:6px 0;overflow-wrap:anywhere}.cmt span{color:var(--muted);font-size:12px}
.cin{display:flex;gap:8px;margin-top:8px}.cin input{padding:10px 14px;border-radius:14px;background:var(--ink)}
.sw{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.sw input{width:24px;height:24px;padding:0;accent-color:var(--violet)}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.send{transition:none}}
</style></head>
<body><div id="app"><p style="padding:40px;color:#9C93C4;font-family:sans-serif">Loading Bouncy…</p></div>
<script>window.onerror=function(m){document.getElementById("app").innerHTML='<p style="padding:30px;color:#FF6B7A;font-family:sans-serif">Something broke: '+m+'</p>'};window.onunhandledrejection=function(e){window.onerror(String(e.reason&&e.reason.message||e.reason))};</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"><\/script>')</script>
<script>
const sb = supabase.createClient('https://nruksvjkytpxbiemtalj.supabase.co','sb_publishable_0MgMCUpV93vXHxkthK5AYQ_9IoQgk0-',{auth:{lock:(n,t,fn)=>fn(),persistSession:true,autoRefreshToken:true}});
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const applyTheme = t => { document.documentElement.dataset.theme = t; document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#150F2E' : '#FFFFFF'; try { localStorage.setItem('bt', t); } catch (e) {} };
const isDark = () => document.documentElement.dataset.theme === 'dark';
applyTheme((() => { try { return localStorage.getItem('bt'); } catch (e) {} })() || 'light');
let me = null, uid = null, items = [], listCh = null, chatCh = null;

let tab = 'feed';
function shell(t){ cleanup(); tab = t || tab;
  app.innerHTML = `<div id="main"></div><nav class="tabs">${[['feed','🔥','Feed'],['chats','💬','Chats'],['me','🙂','Me']].map(x=>`<a data-t="${x[0]}" class="${x[0]===tab?'on':''}"><b>${x[1]}</b>${x[2]}</a>`).join('')}</nav>`;
  $('.tabs').onclick = e => { const a = e.target.closest('a'); if (a) shell(a.dataset.t); };
  ({feed:feedView, chats:listView, me:meView})[tab](); }

const ago = d => { const m = (Date.now()-new Date(d))/6e4; return m<1?'now':m<60?Math.floor(m)+'m':m<1440?Math.floor(m/60)+'h':Math.floor(m/1440)+'d'; };
const shrink = f => new Promise(r => { const i = new Image(); i.onload = () => { const k = Math.min(1,1080/i.width), c = document.createElement('canvas');
  c.width = i.width*k; c.height = i.height*k; c.getContext('2d').drawImage(i,0,0,c.width,c.height); c.toBlob(r,'image/jpeg',.8); }; i.src = URL.createObjectURL(f); });

async function feedView(){
  $('#main').innerHTML = `<div class="head"><h1>Bouncy</h1><a class="link" id="th">${isDark()?'☀️ Light':'🌙 Dark'}</a></div>
  <div class="rows"><div class="comp"><textarea id="pt" rows="2" placeholder="Share something funny…"></textarea>
  <div class="crow"><label class="ph">📷<input type="file" id="pf" accept="image/*" hidden></label><span class="muted" id="pn"></span><button class="btn sm" id="pb">Post</button></div></div>
  <div id="feed"></div></div>`;
  $('#th').onclick = () => { applyTheme(isDark() ? 'light' : 'dark'); $('#th').textContent = isDark() ? '☀️ Light' : '🌙 Dark'; };
  let file = null;
  $('#pf').onchange = e => { file = e.target.files[0]; $('#pn').textContent = file ? file.name : ''; };
  $('#pb').onclick = async () => { const body = $('#pt').value.trim(); if (!body && !file) return;
    const b = $('#pb'); b.disabled = true; let url = null;
    if (file) { const path = `${me.id}/${Date.now()}.jpg`;
      const {error} = await sb.storage.from('posts').upload(path, await shrink(file), {contentType:'image/jpeg'});
      if (error) { b.disabled = false; $('#pn').textContent = 'Photo failed. Try again.'; return; }
      url = sb.storage.from('posts').getPublicUrl(path).data.publicUrl; }
    const {error} = await sb.from('posts').insert({author_id:me.id, body, image_url:url});
    if (error) { b.disabled = false; $('#pn').textContent = 'Could not post. Try again.'; return; }
    feedView(); };
  const [{data:ps},{data:my}] = await Promise.all([
    sb.from('posts').select('id,body,image_url,created_at,profiles(display_name),likes(count),comments(count)').order('created_at',{ascending:false}).limit(50),
    sb.from('likes').select('post_id').eq('user_id',me.id)]);
  const mine = new Set((my||[]).map(x=>x.post_id)), feed = $('#feed');
  feed.innerHTML = (ps||[]).length ? ps.map(p => { const n = p.profiles?.display_name || 'Someone', c = p.likes?.[0]?.count || 0;
    return `<div class="post"><div class="who"><div class="av">${esc(n[0].toUpperCase())}</div><div><b>${esc(n)}</b><span>${ago(p.created_at)}</span></div></div>
    ${p.body?`<p>${esc(p.body)}</p>`:''}${p.image_url?`<img loading="lazy" src="${esc(p.image_url)}" alt="">`:''}
    <button class="like ${mine.has(p.id)?'on':''}" data-id="${p.id}" data-n="${c}">♥ <i>${c}</i></button><button class="cm" data-id="${p.id}">💬 <i>${p.comments?.[0]?.count || 0}</i></button><div class="cbox"></div></div>`; }).join('')
    : '<p class="empty">No posts yet. Be the first to make people laugh.</p>';
  feed.onclick = async e => {
    const cb = e.target.closest('.cm');
    if (cb) { const box = cb.closest('.post').querySelector('.cbox'); if (box.innerHTML) { box.innerHTML = ''; return; }
      const draw = async () => { const {data} = await sb.from('comments').select('body,created_at,profiles(display_name)').eq('post_id',cb.dataset.id).order('created_at');
        box.innerHTML = (data||[]).map(c => `<div class="cmt"><b>${esc(c.profiles?.display_name||'Someone')}</b> ${esc(c.body)} <span>${ago(c.created_at)}</span></div>`).join('')
          + `<div class="cin"><input placeholder="Add a comment" maxlength="500"><button class="btn sm">Send</button></div>`;
        box.querySelector('.btn').onclick = async () => { const i = box.querySelector('input'), v = i.value.trim(); if (!v) return; i.value = '';
          const {error} = await sb.from('comments').insert({post_id:cb.dataset.id, author_id:me.id, body:v});
          if (!error) { const n = cb.querySelector('i'); n.textContent = +n.textContent + 1; draw(); } }; };
      draw(); return; }
    const b = e.target.closest('.like'); if (!b) return;
    const on = !b.classList.contains('on'), n = +b.dataset.n + (on?1:-1);
    b.classList.toggle('on', on); b.dataset.n = n; b.querySelector('i').textContent = n;
    b.classList.remove('pp'); void b.offsetWidth; b.classList.add('pp');
    on ? await sb.from('likes').insert({post_id:b.dataset.id, user_id:me.id}) : await sb.from('likes').delete().match({post_id:b.dataset.id, user_id:me.id}); };
}

async function meView(){
  const {data:p} = await sb.from('profiles').select('display_name').eq('id',me.id).single();
  $('#main').innerHTML = `<div class="head"><h1>Me</h1></div><div class="me"><small>${esc(me.email)}</small>
  <input id="dn" value="${esc(p?.display_name||'')}" placeholder="Your name" maxlength="30"><div class="err" id="ms"></div>
  <button class="btn" id="sv">Save name</button>
  <label class="sw"><span>Dark mode</span><input type="checkbox" id="dm" ${isDark()?'checked':''}></label><a class="link" id="out">Log out</a></div>`;
  $('#sv').onclick = async () => { const v = $('#dn').value.trim(); if (v.length < 2) { $('#ms').textContent = 'Use at least 2 characters.'; return; }
    const {error} = await sb.from('profiles').update({display_name:v}).eq('id',me.id); $('#ms').style.color = error ? '' : 'var(--violet)'; $('#ms').textContent = error ? 'Could not save.' : 'Saved.'; };
  $('#dm').onchange = e => applyTheme(e.target.checked ? 'dark' : 'light');
  $('#out').onclick = () => sb.auth.signOut();
}

function cleanup(){ if(listCh){sb.removeChannel(listCh);listCh=null} if(chatCh){sb.removeChannel(chatCh);chatCh=null} }

function authView(msg='', signup=false, em=''){
  cleanup();
  app.innerHTML = `<div class="auth"><h1 class="logo">Bouncy</h1><p class="tag">Message anyone, instantly.</p>
  <input id="em" type="email" placeholder="Email" autocapitalize="none" value="${esc(em)}">
  <input id="pw" type="password" placeholder="Password (6+ characters)">
  <div class="err">${esc(msg)}</div>
  <button class="btn" id="go">${signup?'Create account':'Log in'}</button>
  <a class="link" id="sw">${signup?'Have an account? Log in':'New here? Create an account'}</a></div>`;
  $('#sw').onclick = () => authView('', !signup, $('#em').value);
  $('#go').onclick = async () => {
    const email = $('#em').value.trim(), password = $('#pw').value;
    const {data, error} = signup ? await sb.auth.signUp({email,password}) : await sb.auth.signInWithPassword({email,password});
    if (error) return authView(error.message, signup, email);
    if (signup && !data.session) authView('Check your email to confirm your account, then log in.', false, email);
  };
}

async function listView(){
  cleanup();
  $('#main').innerHTML = `<div class="head"><h1>Chats</h1></div>
  <input id="q" class="search" placeholder="Find people to message" autocapitalize="none"><div id="rows" class="rows"></div>`;
  const rows = $('#rows'), q = $('#q');
  let found = [], searching = false, timer;
  const draw = () => {
    const list = searching ? found : items;
    if (!list.length) { rows.innerHTML = `<p class="empty">${searching?'No one found. Check the spelling of their name.':'No chats yet. Search for a name above to start one.'}</p>`; return; }
    rows.innerHTML = list.map((x,i) => { const n = searching ? x.display_name : x.title;
      return `<div class="row" data-i="${i}"><div class="av">${esc((n||'?')[0].toUpperCase())}</div><div class="rt"><b>${esc(n)}</b><span>${esc(searching?'Start a chat':(x.preview||'Say hi'))}</span></div></div>`; }).join('');
  };
  const load = async () => {
    const {data: convs} = await sb.from('conversations')
      .select('id,title,created_at,conversation_members(user_id,profiles(display_name))').order('created_at',{ascending:false});
    if (!convs) return;
    const last = {};
    if (convs.length) {
      const {data: msgs} = await sb.from('messages').select('conversation_id,body,created_at')
        .in('conversation_id', convs.map(c=>c.id)).order('created_at',{ascending:false}).limit(300);
      (msgs||[]).forEach(m => { if(!last[m.conversation_id]) last[m.conversation_id]=m; });
    }
    items = convs.map(cv => { const o = cv.conversation_members.find(m=>m.user_id!==me.id), lm = last[cv.id];
      return {id:cv.id, otherId:o?.user_id, title:cv.title||o?.profiles?.display_name||'Chat', preview:lm?.body, at:lm?.created_at||cv.created_at}; })
      .sort((a,b)=>a.at<b.at?1:-1);
    if (!searching) draw();
  };
  rows.onclick = e => { const r = e.target.closest('.row'); if(!r) return;
    const x = (searching?found:items)[+r.dataset.i]; searching ? start(x) : chatView({id:x.id,title:x.title}); };
  q.oninput = () => { clearTimeout(timer); const v = q.value.trim(); searching = v.length>=2;
    if (!searching) return draw();
    timer = setTimeout(async () => { const {data} = await sb.from('profiles').select('id,display_name')
      .ilike('display_name',`%${v}%`).neq('id',me.id).limit(8); found = data||[]; draw(); }, 250); };
  listCh = sb.channel('list').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},load).subscribe();
  draw(); await load();
}

async function start(p){
  const ex = items.find(i=>i.otherId===p.id);
  if (ex) return chatView({id:ex.id,title:ex.title});
  const {data:cv, error} = await sb.from('conversations').insert({created_by:me.id}).select('id').single();
  if (error) return;
  await sb.from('conversation_members').insert([{conversation_id:cv.id,user_id:me.id},{conversation_id:cv.id,user_id:p.id}]);
  chatView({id:cv.id,title:p.display_name});
}

async function chatView(chat){
  cleanup(); history.pushState({c:1},'');
  app.innerHTML = `<div class="head chead"><a class="back" id="back">‹</a><h2>${esc(chat.title)}</h2></div>
  <div id="msgs" class="msgs"></div>
  <div class="bar"><textarea id="tx" rows="1" placeholder="Message"></textarea><button class="send" id="send" aria-label="Send">↑</button></div>`;
  const box = $('#msgs'), tx = $('#tx'), seen = new Set();
  const add = (m, pop) => { if (seen.has(m.id)) return; seen.add(m.id);
    const d = document.createElement('div'); d.className = 'bub '+(m.sender_id===me.id?'mine':'theirs')+(pop?' pop':'');
    d.innerHTML = `<div class="bd">${esc(m.body)}</div><div class="tm">${new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>`;
    box.appendChild(d); box.scrollTop = box.scrollHeight; };
  const send = async () => { const body = tx.value.trim(); if(!body) return; tx.value=''; tx.style.height='auto';
    const {data,error} = await sb.from('messages').insert({conversation_id:chat.id,sender_id:me.id,body}).select().single();
    if (error) { tx.value = body; return; } add(data,true); };
  $('#back').onclick = () => history.back();
  $('#send').onclick = send;
  tx.oninput = () => { tx.style.height='auto'; tx.style.height = Math.min(tx.scrollHeight,120)+'px'; };
  tx.onkeydown = e => { if (e.key==='Enter' && !e.shiftKey && !matchMedia('(pointer:coarse)').matches) { e.preventDefault(); send(); } };
  const {data} = await sb.from('messages').select('*').eq('conversation_id',chat.id).order('created_at',{ascending:false}).limit(100);
  (data||[]).reverse().forEach(m=>add(m,false));
  chatCh = sb.channel('chat-'+chat.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`conversation_id=eq.${chat.id}`},
    ({new:m})=>add(m,true)).subscribe();
}

window.addEventListener('popstate', () => { if (me) shell(); });
let started = false;
setTimeout(() => { if (!started) { started = true; authView('Still connecting. Log in to continue.'); } }, 4000);
sb.auth.onAuthStateChange((_e, s) => { started = true; me = s?.user || null; const id = me?.id || null;
  if (id !== uid) { uid = id; setTimeout(() => { me ? shell('feed') : authView(); }, 0); } });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
