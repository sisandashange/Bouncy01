name: Fashion Studio Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "fashion-studio/**"
      - ".github/workflows/fashion-studio-android.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build installable Android test APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install app dependencies
        working-directory: fashion-studio
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: fashion-studio
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build debug APK
        working-directory: fashion-studio/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fashion-studio-android-debug
          path: fashion-studio/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
