name: Build BOUNCY Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build installable APK with Expo EAS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate Expo configuration
        env:
          EXPO_DEBUG: "1"
        run: npx expo config --json

      - name: Link project to Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli init --force --non-interactive

      - name: Build APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform android --profile preview --non-interactive
